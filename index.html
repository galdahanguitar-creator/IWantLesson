  <script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

// ── Firebase config ───────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCl0G_SiV1GJGnGIg5X-l_zo6EX4XldJJs",
  authDomain: "i-want-lesson.firebaseapp.com",

// ── Date utilities ─────────────────────────────────────────────────────────────
const DAY_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function parseD(s) { return new Date(s + 'T12:00:00'); }
function fmtD(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function wkStart(s) { const d = parseD(s); d.setDate(d.getDate() - d.getDay()); return fmtD(d); }
function todayS() { return fmtD(new Date()); }
function dd(s) { const d = parseD(s); return `${d.getDate()}/${d.getMonth()+1}`; }
function inWk(ds, ws) { return ds >= ws && ds < addDays(ws, 7); }
function hoursUntil(dateS, time) { return (new Date(`${dateS}T${time}:00`) - new Date()) / 3600000; }
function isValidTime(t) { const h = parseInt(t, 10); return h >= 7 && h < 22; }

// ── Date helpers used by the projection ──────────────────────────────────────
// The date of a given weekday (di) inside the week that starts at weekStart.
function dateOfDi(weekStart, di) {
  const d = parseD(weekStart);
  while (d.getDay() !== di) d.setDate(d.getDate() + 1);
  return fmtD(d);
}
// Every week start from `from` up to and including `to`, capped for safety.
function weeksBetween(from, to, cap = 16) {
  const out = [];
  let w = wkStart(from);
  const end = wkStart(to);
  while (w <= end && out.length < cap) { out.push(w); w = addDays(w, 7); }
  return out;
}

// ── When a recurring hour is in force ────────────────────────────────────────
// A recurring hour is not eternal. It starts when the teacher created it and
// it may end when she moves or deletes it — and BOTH dates matter, because a
// week that is already published and full must not be rewritten by a change
// made while planning the week after it.
//
//   since   first date the hour exists (inclusive)
//   until   first date it no longer exists (exclusive); absent = still current
//
// A change to the recurring schedule always takes effect on a WEEK boundary.
// Anything stamped mid-week — every `since` written before this rule existed
// was stamped with the day the button happened to be pressed — is therefore
// read as "from the following week". That is exactly the bug this fixes: an
// hour added while looking at next week used to land in the middle of the
// current week, on top of hours that were already given out.
function effWeek(d) { return !d ? '' : (d === wkStart(d) ? d : addDays(wkStart(d), 7)); }

function slotLivesInWeek(slot, weekStart) {
  const from = effWeek(slot.since);
  const to   = effWeek(slot.until);
  if (from && weekStart < from) return false;
  if (to   && weekStart >= to)  return false;
  return true;
}

// The recurring schedule as it stands in one particular week.
function slotsForWeek(slots, weekStart) {
  return (slots || []).filter(s => slotLivesInWeek(s, weekStart));
}

// The entries a write should still touch: an hour that has already been ended
// is history and must keep its old shape, or the past would change with it.
function isLiveSlot(s) { return !s.until; }

// ── Holidays ─────────────────────────────────────────────────────────────────
// Default list only. Each teacher gets her own editable copy in her settings
// document the first time she signs in, so this never silently expires and two
// teachers can keep different calendars.
const DEFAULT_HOLIDAYS = [
  // Chof HaCarmel school calendar, 2026-27. Shared by every teacher in the
  // school as the starting point; each can then edit her own copy.
  { name:'ראש השנה',    s:'2026-09-11', e:'2026-09-13' },
  { name:'יום כיפור',   s:'2026-09-20', e:'2026-09-21' },
  { name:'גשר חופש',    s:'2026-09-22', e:'2026-09-24' },
  { name:'סוכות',       s:'2026-09-25', e:'2026-10-03' },
  { name:'בחירות',      s:'2026-10-27', e:'2026-10-27' },
  { name:'חנוכה',       s:'2026-12-06', e:'2026-12-12' },
  { name:'ט"ו בשבט',    s:'2027-01-22', e:'2027-01-23' },
  { name:'פורים',       s:'2027-03-23', e:'2027-03-24' },
  { name:'פסח',         s:'2027-04-13', e:'2027-04-28' },
  { name:'יום הזיכרון', s:'2027-05-11', e:'2027-05-11' },
  { name:'יום העצמאות', s:'2027-05-12', e:'2027-05-12' },
  { name:'שבועות',      s:'2027-06-10', e:'2027-06-11' },
];

// Active holiday list — swapped in once the tenant's settings load. Kept as a
// module-level binding so the presentational components stay prop-free.
let HOLIDAYS = DEFAULT_HOLIDAYS;
function setHolidays(list) { HOLIDAYS = Array.isArray(list) && list.length ? list : DEFAULT_HOLIDAYS; }
function getHoliday(ds) { return HOLIDAYS.find(h => ds >= h.s && ds <= h.e) || null; }

// ── Student access codes ──────────────────────────────────────────────────────
// The code IS the Firestore document id, and it is the only thing standing
// between a stranger and that student's record — so it must be unguessable.
// Alphabet excludes 0/O/1/I/L to survive being read aloud over the phone.
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(len = 6) {
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  let out = '';
  for (let i = 0; i < len; i++) out += CODE_ALPHABET[bytes[i] % CODE_ALPHABET.length];
  return out;
}

// ── Lesson projection ─────────────────────────────────────────────────────────
// Lessons are NOT stored ahead of time. The future is projected from the
// teacher's recurring slots; a document exists only once something real has
// happened to that lesson — it was held, cancelled, moved, or booked one-off.
// This returns the same flat shape the whole UI already expects.
// A lesson in one of these states is still holding its hour. `pending_move` is
// a late move waiting on the teacher: the student keeps the old hour and the
// new one is reserved, so neither can be handed to anyone else meanwhile.
const LIVE = ['scheduled', 'pending_cancel', 'pending_move'];
const isLive = (status) => LIVE.includes(status);

function lessonId(sid, date, time, suffix)  { return `${sid}_${date}_${time}${suffix || ''}`; }

function projectLessons(slots, students, real, weeks) {
  const byId = new Map(real.map(l => [l.id, l]));
  const used = new Set();
  const out  = [];

  function place(sid, date, time, suffix) {
    const id = lessonId(sid, date, time, suffix);
    if (byId.has(id)) { out.push(byId.get(id)); used.add(id); }
    else out.push({ id, sid, date, time, status:'scheduled', reason:'', cancelledAt:null, virtual:true });
  }

  weeks.forEach(ws => {
    // Primary recurring slot, from the teacher's schedule.
    slots.forEach(slot => {
      if (!slot.sid) return;                                        // open slot
      if (!students.some(s => s.id === slot.sid)) return;           // stale sid
      const date = dateOfDi(ws, slot.di);
      // `since`/`until` record when this assignment started and, if it has
      // been moved or dropped, when it stopped. Without them, projecting
      // would place today's schedule onto every week — inventing lessons at
      // hours the student was never taught, and losing the hours they were.
      if (!slotLivesInWeek(slot, ws)) return;
      place(slot.sid, date, slot.t);
    });
    // Optional second weekly lesson, stored on the student.
    students.forEach(s => {
      if (!s.secondSlot) return;
      const date = dateOfDi(ws, s.secondSlot.di);
      if (!slotLivesInWeek(s.secondSlot, ws)) return;
      place(s.id, date, s.secondSlot.t, '_2nd');
    });
  });

  // Anything real that the projection did not cover: history, one-off lessons,
  // lessons whose slot has since been moved or deleted.
  real.forEach(l => { if (!used.has(l.id)) out.push(l); });
  return out;
}

// ── branches (שלוחות) ────────────────────────────────────────────────────────
// One teacher, several villages. The branch belongs to the HOUR, not to the
// day: Thursday morning is one village and Thursday afternoon another, and a
// day-level model cannot say that. Everything below therefore keys off
// `slot.br`, an id from the teacher's own list.
//
// Two separate switches, deliberately. `branches` is the list; `branchesOn` is
// whether it is enforced. Defining a branch must not instantly empty every
// student's board — the teacher tags her hours in peace first, then turns it on.
function branchName(branches, id) {
  const b = (branches || []).find(x => x.id === id);
  return b ? b.name : '';
}

// What a student is allowed to see and take. `null` branch on an hour means the
// teacher has not said where it is; while branches are enforced that hour is
// hers alone, because guessing wrong sends a child to the wrong village.
function slotVisibleTo(slot, studentBr, on) {
  if (!on) return true;
  if (!slot.br) return false;
  if (!studentBr) return false;
  return slot.br === studentBr;
}

// ── Which hours are open, on the teacher's side ───────────────────────────────
// One answer, used by every teacher surface: both week calendars, the one-off
// lesson picker and the move-lesson picker.
//
// This used to be written out separately in three places, and they disagreed.
// The current-week version never looked at that week's plan, so hours the
// teacher had blocked were still offered to her for booking — and an hour a
// fixed student had cancelled was offered to her students but not to her.
//
//   plan            teacher.weekPlans[weekStart] — blocks, extra hours, and
//                   students removed from that week. Null before a week is
//                   planned, which simply means "nothing blocked".
//   minHours        reject hours less than this many hours away (null = any
//                   hour in the week; 0 = future only).
//   excludeLessonId the lesson being moved does not count as occupying its own
//                   hour.
function openSlotsFor(weekStart, { baseSlots = [], plan = null, lessons = [], students = [], minHours = null, excludeLessonId = null } = {}) {
  const blocked   = (plan && plan.blockedSlots) || [];
  const cancelled = (plan && plan.cancelledIds) || [];
  const seen = new Set();
  const out  = [];

  const candidates = [
    // Only the hours that are in force in THIS week. An hour the teacher added
    // or moved while planning a later week does not exist here yet.
    ...slotsForWeek(baseSlots, weekStart).map(s => ({ di: s.di, t: s.t, br: s.br || null })),
    ...(((plan && plan.extraSlots) || [])).map(s => ({ di: s.di, t: s.t, br: s.br || null })),
  ];

  candidates.forEach(s => {
    if (!isValidTime(s.t)) return;
    const key = `${s.di}_${s.t}`;
    if (seen.has(key)) return;
    seen.add(key);
    if (blocked.some(b => b.di === s.di && b.t === s.t)) return;
    const date = dateOfDi(weekStart, s.di);
    if (getHoliday(date)) return;
    if (minHours != null && hoursUntil(date, s.t) < minHours) return;
    // An hour is taken by whoever holds a live lesson in it — including the
    // recurring lesson projected onto a fixed student's own slot. A student the
    // teacher has removed from this week holds nothing.
    const taken = lessons.some(l =>
      l.date === date && l.time === s.t &&
      isLive(l.status) &&
      l.id !== excludeLessonId &&
      !cancelled.includes(l.sid) &&
      students.some(st => st.id === l.sid));
    if (taken) return;
    out.push({ date, time: s.t, di: s.di, br: s.br || null });
  });

  return out.sort((a, b) => a.di !== b.di ? a.di - b.di : a.time.localeCompare(b.time));
}

// ── Shared styles ─────────────────────────────────────────────────────────────
const S = {
  page:   { direction:'rtl', fontFamily:'var(--font-sans)', padding:'0 0 80px', minHeight:'100vh', background:'var(--color-background-tertiary)' },
  header: { background:'var(--color-background-primary)', borderBottom:'3px solid #378ADD', padding:'14px 16px', display:'flex', alignItems:'center', justifyContent:'space-between' },
  title:  { fontSize:18, fontWeight:700, margin:0, color:'#185FA5' },
  tabs:   { display:'flex', background:'var(--color-background-primary)', borderBottom:'0.5px solid var(--color-border-tertiary)', overflowX:'auto' },
  tab:    (active) => ({ padding:'11px 16px', fontSize:13, fontWeight: active?600:400, color: active?'#378ADD':'var(--color-text-secondary)', cursor:'pointer', whiteSpace:'nowrap', background: active?'#f0f7ff':'none', border:'none', borderBottom: active?'2.5px solid #378ADD':'2.5px solid transparent' }),
  body:   { padding:'12px 14px' },
  card:   { background:'var(--color-background-primary)', border:'1px solid var(--color-border-tertiary)', borderRadius:'var(--border-radius-lg)', padding:'14px 16px', marginBottom:10 },
  btn:    (variant='default') => ({
    padding:'9px 18px', fontSize:13, fontWeight:600, borderRadius:'8px', cursor:'pointer', border:'1.5px solid',
    ...(variant==='primary'   ? { background:'#378ADD', color:'#ffffff', borderColor:'#185FA5' } : {}),
    ...(variant==='danger'    ? { background:'#FCEBEB', color:'#A32D2D', borderColor:'#F7C1C1' } : {}),
    ...(variant==='success'   ? { background:'#EAF3DE', color:'#27500A', borderColor:'#C0DD97' } : {}),
    ...(variant==='warning'   ? { background:'#FAEEDA', color:'#854F0B', borderColor:'#FAC775' } : {}),
    ...(variant==='default'   ? { background:'var(--color-background-primary)', color:'var(--color-text-secondary)', borderColor:'var(--color-border-secondary)' } : {}),
    ...(variant==='ghost'     ? { background:'transparent', color:'#378ADD', borderColor:'transparent' } : {}),
    ...(variant==='info'      ? { background:'#E6F1FB', color:'#185FA5', borderColor:'#B5D4F4' } : {}),
  }),
  badge: (color='info') => ({
    display:'inline-block', fontSize:11, padding:'3px 10px', borderRadius:6, fontWeight:600,
    background:`var(--color-background-${color})`, color:`var(--color-text-${color})`,
  }),
  input: { width:'100%', fontSize:14, padding:'9px 12px', borderRadius:'8px', border:'1.5px solid var(--color-border-secondary)', background:'var(--color-background-primary)', color:'var(--color-text-primary)', boxSizing:'border-box' },
  row:   { display:'flex', gap:8, alignItems:'center' },
  label: { fontSize:12, color:'var(--color-text-secondary)', marginBottom:4, fontWeight:500 },
};

const STATUS_META = {
  scheduled:             { label:'מתוכנן',           color:'info' },
  completed:             { label:'התקיים',           color:'success' },
  moved:                 { label:'הועבר לשעה אחרת', color:'default' },
  cancelled_justified:   { label:'בוטל (מוצדק)',     color:'warning' },
  cancelled_unjustified: { label:'בוטל (לא מוצדק)',  color:'danger' },
  teacher_cancelled:     { label:'בוטל ע"י המורה',   color:'default' },
  pending_cancel:        { label:'ממתין לביטול',     color:'warning' },
  pending_move:          { label:'העברה — ממתין לאישור', color:'warning' },
  no_show:               { label:'לא הגיע',          color:'danger' },
};

function StatusBadge({ status }) {
  const m = STATUS_META[status] || { label:status, color:'default' };
  return <span style={S.badge(m.color)}>{m.label}</span>;
}

function HolBadge({ date }) {
  const h = getHoliday(date);
  if (!h) return null;
  return <span style={{ ...S.badge('warning'), marginRight:6, fontSize:10 }}>{h.name}</span>;
}

function Modal({ children, onClose }) {
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:200, display:'flex', alignItems:'flex-end', justifyContent:'center' }} onClick={onClose}>
      <div style={{ background:'var(--color-background-primary)', borderRadius:'18px 18px 0 0', padding:'20px 16px 40px', width:'100%', maxWidth:440, maxHeight:'90vh', overflowY:'auto' }} onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

// ── Week Calendar Grid ────────────────────────────────────────────────────────
// Supports horizontal + vertical scroll. Header and time-col are sticky.
// days: [{date, di}]
// items: [{date, time, ...}]
// renderItem(item, topPx, heightPx) → absolutely-positioned JSX
// onColumnClick(di, date, timeStr) — optional, fires on empty column click
function WeekCalendar({ days, items, renderItem, onColumnClick }) {
  const PX_MIN = 1.55;
  const TIME_W = 36;
  const COL_MIN = 66; // min column width — allows 5 cols on a 375px screen
  const ITEM_H = 45 * PX_MIN - 2;

  // The day shown by default. The window then widens to fit anything outside
  // it, so an early-morning or late-afternoon hour is never drawn off the grid
  // where it cannot be seen or tapped. Hours are allowed from 07:00 to 22:00,
  // which is the range the rest of the app accepts.
  const DEF_MIN = 8, DEF_MAX = 18;
  const [MIN_H, MAX_H] = useMemo(() => {
    let lo = DEF_MIN, hi = DEF_MAX;
    items.forEach(it => {
      const [h, m] = String(it.time || '').split(':').map(Number);
      if (!Number.isFinite(h)) return;
      const start = h + (m || 0) / 60;
      lo = Math.min(lo, Math.floor(start));
      hi = Math.max(hi, Math.ceil(start));   // the 45 minutes after it fit in the slack below
    });
    return [Math.max(7, lo), Math.min(22, hi)];
  }, [items]);

  // One lesson-height of slack at the bottom, so an item starting on the last
  // hour line is not clipped by the container.
  const GRID_H = (MAX_H - MIN_H) * 60 * PX_MIN + ITEM_H;

  const hours = Array.from({ length: MAX_H - MIN_H + 1 }, (_, i) => MIN_H + i);

  function timeToTop(t) {
    const [h, m] = t.split(':').map(Number);
    return ((h - MIN_H) * 60 + m) * PX_MIN;
  }

  function handleColumnClick(di, date, e) {
    if (!onColumnClick) return;
    // offsetY is relative to the clicked element (column div) since children have pointerEvents:none or stopPropagation
    const y = e.nativeEvent.offsetY;
    let totalMins = y / PX_MIN;
    let h = Math.floor(totalMins / 60) + MIN_H;
    let m = Math.round((totalMins % 60) / 5) * 5;
    if (m >= 60) { m = 0; h += 1; }
    h = Math.min(Math.max(h, MIN_H), MAX_H - 1);
    onColumnClick(di, date, `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
  }

  return (
    <div style={{ border:'0.5px solid var(--color-border-tertiary)', borderRadius:12, overflow:'hidden', background:'var(--color-background-primary)', marginBottom:12, direction:'ltr' }}>
      {/* Single scroll container — both axes */}
      <div style={{ overflowX:'auto', overflowY:'auto', maxHeight:520 }}>
        <div style={{ minWidth: TIME_W + days.length * COL_MIN, position:'relative' }}>

          {/* ── Sticky header row ── */}
          <div style={{ display:'flex', position:'sticky', top:0, zIndex:10, background:'var(--color-background-secondary)', borderBottom:'1px solid var(--color-border-tertiary)' }}>
            {/* Corner cell — sticky left AND top */}
            <div style={{ width:TIME_W, flexShrink:0, position:'sticky', left:0, zIndex:11, background:'var(--color-background-secondary)' }} />
            {days.map(day => {
              const hol = getHoliday(day.date);
              const isToday = fmtD(new Date()) === day.date;
              return (
                <div key={day.date} style={{ flex:1, minWidth:COL_MIN, textAlign:'center', padding:'7px 2px', borderLeft:'0.5px solid var(--color-border-tertiary)' }}>
                  <div style={{ fontSize:10, color:'var(--color-text-secondary)', marginBottom:1 }}>יום {DAY_HE[day.di]}</div>
                  <div style={{
                    fontSize:17, fontWeight:600, margin:'0 auto',
                    width:26, height:26, lineHeight:'26px', borderRadius:'50%',
                    color: isToday ? '#fff' : 'var(--color-text-primary)',
                    background: isToday ? '#2563eb' : 'transparent',
                  }}>{parseD(day.date).getDate()}</div>
                  {hol && <div style={{ fontSize:9, color:'var(--color-text-warning)', overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis' }}>{hol.name}</div>}
                </div>
              );
            })}
          </div>

          {/* ── Body row ── */}
          <div style={{ display:'flex', height:GRID_H }}>
            {/* Sticky time column */}
            <div style={{ width:TIME_W, flexShrink:0, position:'sticky', left:0, zIndex:5, background:'var(--color-background-secondary)', height:GRID_H }}>
              {hours.map(h => (
                <div key={h} style={{ position:'absolute', top:(h-MIN_H)*60*PX_MIN-7, left:0, right:4, fontSize:9, color:'var(--color-text-secondary)', textAlign:'right', userSelect:'none', direction:'ltr', pointerEvents:'none' }}>
                  {String(h).padStart(2,'0')}:00
                </div>
              ))}
            </div>

            {/* Day columns */}
            {days.map(day => (
              <div
                key={day.date}
                style={{ flex:1, minWidth:COL_MIN, height:GRID_H, position:'relative', borderLeft:'0.5px solid var(--color-border-tertiary)', cursor: onColumnClick ? 'crosshair' : 'default' }}
                onClick={e => handleColumnClick(day.di, day.date, e)}
              >
                {hours.map(h => (
                  <div key={h} style={{ position:'absolute', top:(h-MIN_H)*60*PX_MIN, left:0, right:0, borderTop:'0.5px solid var(--color-border-tertiary)', opacity:0.35, pointerEvents:'none' }} />
                ))}
                {hours.map(h => (
                  <div key={`${h}.5`} style={{ position:'absolute', top:((h-MIN_H)*60+30)*PX_MIN, left:0, right:0, borderTop:'0.5px dashed var(--color-border-tertiary)', opacity:0.18, pointerEvents:'none' }} />
                ))}
                {items.filter(item => item.date === day.date).map(item =>
                  renderItem(item, timeToTop(item.time), ITEM_H)
                )}
              </div>
            ))}
          </div>

        </div>
      </div>
    </div>
  );
}

// ── Student self-registration ─────────────────────────────────────────────────
// Reached at #register/<teacherId> — each teacher hands out her own link, so a
// request always lands in the right teacher's inbox.
function RegisterView({ db, teacherId, studioName }) {
  const [name,    setName]    = useState('');
  const [phone,   setPhone]   = useState('');
  const [parent,  setParent]  = useState('');
  const [hasPref, setHasPref] = useState(false);
  const [di,      setDi]      = useState(1);
  const [time,    setTime]    = useState('09:00');
  const [done,    setDone]    = useState(false);
  const [busy,    setBusy]    = useState(false);
  const [err,     setErr]     = useState('');

  async function submit() {
    if (!name.trim() || !phone.trim()) return;
    setBusy(true); setErr('');
    try {
      await db.collection('pending_students').add({
        teacherId,
        name: name.trim(), phone: phone.trim(), parent: parent.trim(),
        type: 'pending', di: hasPref ? di : null, t: hasPref ? time : null,
        submittedAt: new Date().toISOString(),
      });
      setDone(true);
    } catch(e) {
      console.error(e);
      setErr('שליחת הבקשה נכשלה. בדוק את החיבור לאינטרנט ונסה שוב.');
    }
    setBusy(false);
  }

  if (!teacherId) return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'100vh', gap:14, padding:24, background:'var(--color-background-tertiary)' }}>
      <div style={{ fontSize:46 }}>🔗</div>
      <h2 style={{ fontSize:18, fontWeight:600, textAlign:'center', margin:0 }}>קישור הרשמה לא תקין</h2>
      <p style={{ fontSize:14, color:'var(--color-text-secondary)', textAlign:'center', margin:0, maxWidth:300 }}>
        בקש מהמורה שלך את קישור ההרשמה המלא.
      </p>
    </div>
  );

  if (done) return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'100vh', gap:16, padding:20, background:'var(--color-background-tertiary)' }}>
      <div style={{ fontSize:52 }}>✅</div>
      <h2 style={{ fontSize:20, fontWeight:500, textAlign:'center', margin:0 }}>הבקשה נשלחה!</h2>
      <p style={{ fontSize:14, color:'var(--color-text-secondary)', textAlign:'center', margin:0, maxWidth:280 }}>
        המורה יאשר את הרישום שלך בקרוב ויישלח לך קוד כניסה אישי.
      </p>
    </div>
  );

  return (
    <div style={{ direction:'rtl', fontFamily:'var(--font-sans)', minHeight:'100vh', background:'var(--color-background-tertiary)', display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
      <div style={{ width:'100%', maxWidth:360 }}>
        <h1 style={{ fontSize:20, fontWeight:500, textAlign:'center', marginBottom:4 }}>{studioName || 'אולפן מוסיקה'}</h1>
        <p style={{ fontSize:13, color:'var(--color-text-secondary)', textAlign:'center', marginBottom:20 }}>טופס הרשמה לתלמיד חדש</p>
        {err && <div style={{ background:'var(--color-background-danger)', color:'var(--color-text-danger)', fontSize:13, padding:'9px 12px', borderRadius:'var(--border-radius-md)', marginBottom:12 }}>{err}</div>}
        <div style={{ background:'var(--color-background-primary)', borderRadius:'var(--border-radius-lg)', padding:'16px 14px', border:'0.5px solid var(--color-border-tertiary)' }}>
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:12, color:'var(--color-text-secondary)', marginBottom:4 }}>שם מלא *</div>
            <input style={{ width:'100%', fontSize:14, padding:'8px 10px', borderRadius:'var(--border-radius-md)', border:'0.5px solid var(--color-border-secondary)', background:'var(--color-background-primary)', color:'var(--color-text-primary)', boxSizing:'border-box' }}
              value={name} onChange={e=>setName(e.target.value)} placeholder="שם פרטי ומשפחה" autoFocus />
          </div>
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:12, color:'var(--color-text-secondary)', marginBottom:4 }}>טלפון *</div>

// Teachers authenticate against Firebase Auth — no shared secret lives in this
// file. Students present their personal code, which is normally carried in the
// link they were sent; typing it is only the fallback.
function LoginView({ onTeacher, onStudent }) {
  const [mode,  setMode]  = useState(null);
  const [email, setEmail] = useState('');
  const [pass,  setPass]  = useState('');
  const [code,  setCode]  = useState('');
  const [err,   setErr]   = useState('');
  const [busy,  setBusy]  = useState(false);

  async function submitTeacher() {
    if (!email.trim() || !pass) return;
    setBusy(true); setErr('');
    const msg = await onTeacher(email.trim(), pass);
    if (msg) setErr(msg);
    setBusy(false);
  }

  async function submitStudent() {
    if (!code.trim()) return;
    setBusy(true); setErr('');
    const msg = await onStudent(code.trim().toUpperCase());
    if (msg) setErr(msg);
    setBusy(false);
  }

  function back() { setMode(null); setErr(''); setPass(''); setCode(''); }

  return (
    <div style={{ ...S.page, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'100vh', gap:22, padding:16 }}>

      {!mode && (
        <div style={{ display:'flex', flexDirection:'column', gap:12, width:'100%', maxWidth:300 }}>
          <button style={{ ...S.btn('primary'), width:'100%', padding:'13px', fontSize:15 }} onClick={() => setMode('teacher')}>כניסת מורה</button>
          <button style={{ ...S.btn('default'), width:'100%', padding:'13px', fontSize:15 }} onClick={() => setMode('student')}>כניסת תלמיד</button>
        </div>
      )}

      {mode === 'teacher' && (
        <div style={{ ...S.card, width:'100%', maxWidth:320 }}>
          <div style={S.label}>אימייל</div>
          <input style={{ ...S.input, marginBottom:10, direction:'ltr', textAlign:'left' }} type="email"
            autoComplete="username" value={email} onChange={e => setEmail(e.target.value)}
            onKeyDown={e => e.key==='Enter' && submitTeacher()} autoFocus />
          <div style={S.label}>סיסמה</div>
          <input style={{ ...S.input, direction:'ltr', textAlign:'left' }} type="password"
            autoComplete="current-password" value={pass} onChange={e => setPass(e.target.value)}
            onKeyDown={e => e.key==='Enter' && submitTeacher()} />
          {err && <p style={{ color:'var(--color-text-danger)', fontSize:13, margin:'10px 0 0' }}>{err}</p>}
          <div style={{ ...S.row, marginTop:14, justifyContent:'space-between' }}>
            <button style={S.btn('ghost')} onClick={back}>חזרה</button>
            <button style={S.btn('primary')} disabled={busy} onClick={submitTeacher}>
              {busy ? 'מתחבר...' : 'כניסה'}
            </button>
          </div>
          <p style={{ fontSize:11, color:'var(--color-text-secondary)', textAlign:'center', margin:'12px 0 0' }}>
            חשבון מורה נפתח על ידי מנהל המערכת
          </p>
        </div>
      )}

      {mode === 'student' && (
        <div style={{ ...S.card, width:'100%', maxWidth:320 }}>
          <div style={S.label}>הקוד האישי שלך</div>
          <input style={{ ...S.input, textAlign:'center', letterSpacing:'0.3em', fontSize:22,
                          fontWeight:600, textTransform:'uppercase', padding:'12px' }}
            placeholder="XXXXXX" maxLength={8} value={code}
            onChange={e => setCode(e.target.value.toUpperCase())}
            onKeyDown={e => e.key==='Enter' && submitStudent()} autoFocus />
          {err && <p style={{ color:'var(--color-text-danger)', fontSize:13, margin:'10px 0 0' }}>{err}</p>}
          <div style={{ ...S.row, marginTop:14, justifyContent:'space-between' }}>
            <button style={S.btn('ghost')} onClick={back}>חזרה</button>
            <button style={S.btn('primary')} disabled={busy} onClick={submitStudent}>
              {busy ? 'בודק...' : 'כניסה'}

          </div>
          <p style={{ fontSize:11, color:'var(--color-text-secondary)', textAlign:'center', margin:'12px 0 0' }}>
            קיבלת קישור מהמורה? פתח אותו והמכשיר יזכור אותך
          </p>
        </div>
      )}
    </div>
  );
}

// ── Teacher: This Week ────────────────────────────────────────────────────────
// Shows the whole week, not only the hours that already have a lesson: free
// hours can be filled from here, and an hour can be blocked mid-week when
// something comes up. Both act on the week students are already looking at.
function TeacherWeekTab({ ctx }) {
  const { lessons, students, TODAY, THIS_WK, pubThis, baseSlots, addLesson, updLesson, setWeekBlock, setWeekExtra,
          branches = [], branchesOn = false, setSlotBranch } = ctx;
  const [selected, setSelected] = useState(null);   // a calendar item
  const [assigning, setAssigning] = useState(null); // {date,time,di}
  const [busy, setBusy] = useState(false);
  const [addingExtra, setAddingExtra] = useState(false);
  const [exDi, setExDi] = useState(parseD(TODAY).getDay());
  const [exT,  setExT]  = useState('09:00');
  const [exBr, setExBr] = useState(null);

  // Which of this week's open hours are one-off additions rather than part of
  // the standing schedule — they get their own colour and can be taken back.
  const extraKeys = useMemo(
    () => new Set((pubThis?.extraSlots || []).map(e => `${e.di}_${e.t}`)),
    [pubThis]
  );

  function endTime(t) {
    const [h,m] = t.split(':').map(Number);
    const e = h*60 + m + 45;
    return `${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`;
  }

  // The standing schedule as it applies to THIS week — not as it will look
  // after changes the teacher has already made for a later week.
  const weekSlots = useMemo(() => slotsForWeek(baseSlots, THIS_WK), [baseSlots, THIS_WK]);

  // Where an hour is, taken from the standing schedule or from this week's plan.
  function brOfSlot(di, t) {
    const base  = weekSlots.find(x => x.di === di && x.t === t);
    if (base) return base.br || null;
    const extra = (pubThis?.extraSlots || []).find(x => x.di === di && x.t === t);
    return extra ? (extra.br || null) : null;
  }

  // She cannot be in two villages an hour apart. This does not block — plenty of
  // real weeks have tight turnarounds she has already thought about — but an
  // unnoticed one sends her driving mid-lesson.
  function travelWarning(di, t, br) {
    if (!branches.length || !br) return '';
    const mins = x => { const [h,m] = x.split(':').map(Number); return h*60+m; };
    const near = weekSlots
      .filter(x => x.di === di && x.br && x.br !== br)
      .filter(x => Math.abs(mins(x.t) - mins(t)) < 90);
    if (!near.length) return '';
    return `שים לב: ביום ${DAY_HE[di]} יש שעה ב"${branchName(branches, near[0].br)}" ב-${near[0].t}, פחות משעה וחצי מהשעה הזו.`;
  }

  function saveExtra() {
    if (!isValidTime(exT)) { alert('שעה לא תקינה — בחר שעה בין 07:00 ל-21:00'); return; }
    if (branches.length && !exBr && !confirm('לא בחרת שלוחה לשעה הזו. בזמן שהשלוחות פעילות היא לא תוצג לאף תלמיד. להוסיף בכל זאת?')) return;
    const w = travelWarning(exDi, exT, exBr);
    if (w && !confirm(`${w}\n\nלהוסיף בכל זאת?`)) return;
    setWeekExtra(THIS_WK, exDi, exT, true, exBr);
    setAddingExtra(false);
  }

  const weekLessons = useMemo(() => lessons.filter(l => inWk(l.date, THIS_WK)), [lessons, THIS_WK]);

  // No `minHours` here: hours that have already passed stay on the calendar,
  // greyed out, so the week does not visibly rearrange itself as the day goes
  // on. Booking into one is refused in the modal.
  const openSlots = useMemo(
    () => openSlotsFor(THIS_WK, { baseSlots, plan: pubThis, lessons, students }),
    [THIS_WK, baseSlots, pubThis, lessons, students]
  );

  // One item per hour, so nothing is drawn on top of anything else: a live
  // lesson wins, then a block, then a free hour, and only then the record of a
  // lesson that is no longer happening.
  const items = useMemo(() => {
    const byKey = new Map();
    const put = (item) => { const k = `${item.date}_${item.time}`; if (!byKey.has(k)) byKey.set(k, item); };

    weekLessons.filter(l => isLive(l.status) && isValidTime(l.time))
      .forEach(l => put({ id:l.id, kind:'lesson', date:l.date, time:l.time, di:parseD(l.date).getDay(),
                          br: brOfSlot(parseD(l.date).getDay(), l.time), lesson:l }));

    // A block is a mark on an hour, so it is only drawn while that hour still
    // exists this week. Blocks left behind by an hour that has since moved or
    // been deleted would otherwise keep sitting on the calendar for ever,
    // often across a lesson that is really there.
    const liveHere = new Set([
      ...weekSlots.map(s => `${s.di}_${s.t}`),
      ...(pubThis?.extraSlots || []).map(e => `${e.di}_${e.t}`),
    ]);
    (pubThis?.blockedSlots || [])
      .filter(b => isValidTime(b.t) && liveHere.has(`${b.di}_${b.t}`))
      .forEach(b => {
        const date = dateOfDi(THIS_WK, b.di);
        put({ id:`blk_${b.di}_${b.t}`, kind:'blocked', date, time:b.t, di:b.di });
      });

    openSlots.forEach(s => {
      // Whose hour this was, but only when they actually dropped it. A student
      // who moved to another hour did not give this one up in any sense worth
      // reporting — they are simply elsewhere, and their lesson is drawn there.
      const gave = weekLessons.find(l => l.date===s.date && l.time===s.time
                                      && ['cancelled_justified','cancelled_unjustified','teacher_cancelled','no_show'].includes(l.status));
      const stu  = gave ? students.find(x => x.id === gave.sid) : null;
      put({ id:`open_${s.date}_${s.time}`, kind:'free', date:s.date, time:s.time, di:s.di, br:s.br,
            isExtra: extraKeys.has(`${s.di}_${s.time}`),
            freedBy:stu?.name || null, freedStatus:gave?.status || null });
    });

    weekLessons.filter(l => !isLive(l.status) && isValidTime(l.time))
      .forEach(l => put({ id:l.id, kind:'lesson', date:l.date, time:l.time, di:parseD(l.date).getDay(), lesson:l }));

    return [...byKey.values()];
  }, [weekLessons, openSlots, pubThis, THIS_WK, students, extraKeys, weekSlots]);

  // Sunday–Thursday always, plus any other day the week actually uses.
  const teachingDays = useMemo(() => {
    const diSet = new Set([0,1,2,3,4, ...items.map(i => i.di)]);
    return [...diSet].sort().map(di => ({ date: dateOfDi(THIS_WK, di), di }));
  }, [items, THIS_WK]);

  // The week is read for the lessons in it. An open hour is an invitation, not
  // an event, so it is drawn quietly — pale, thin, dashed — and never carries a
  // student's name: a student who moved twice would otherwise leave their name
  // scattered across every hour they passed through, reading like three
  // bookings instead of one. Who freed the hour is in the detail sheet.
  function renderItem(item, top, height) {
    let bg, fg, border, label, faded = false, strong = true;
    if (item.kind === 'blocked') {
      bg='#fef2f2'; fg='#b91c1c'; border='#fca5a5'; label='🚫 חסום'; strong = false;
    } else if (item.kind === 'free') {
      const past = hoursUntil(item.date, item.time) <= 0;
      strong = false;
      if (past)              { bg='transparent'; fg='#cbd5e1'; border='#e8edf3'; label='חלף'; faded = true; }
      else if (item.isExtra) { bg='#fffbeb';     fg='#a16207'; border='#fde68a'; label='⭐ חריגה'; }
      else                   { bg='#f5fdfb';     fg='#4b9187'; border='#b7e4db'; label='＋ פנוי'; }
    } else {
      const l = item.lesson;
      const stu = students.find(s => s.id === l.sid);
      const isPending = l.status === 'pending_cancel' || l.status === 'pending_move';
      const isCancelled = ['cancelled_justified','cancelled_unjustified','teacher_cancelled','no_show','moved'].includes(l.status);
      bg = isPending?'#fef3c7':isCancelled?'#f1f5f9':'#dbeafe';
      fg = isPending?'#92400e':isCancelled?'#94a3b8':'#1e40af';
      border = isPending?'#fcd34d':isCancelled?'#cbd5e1':'#93c5fd';
      label = (stu?.name || 'תלמיד שנמחק') + (isPending ? ' ⏳' : '');
      faded = isCancelled;
    }
    return (
      <div key={item.id} onClick={e => { e.stopPropagation(); setSelected(item); }} style={{
        position:'absolute', top, left:2, right:2, height,
        background:bg, border:`1px ${item.kind==='free' ? 'dashed' : 'solid'} ${border}`, borderRadius:5,
        padding:'3px 5px', cursor:'pointer', overflow:'hidden', opacity: faded ? 0.6 : 1,
      }}>
        <div style={{ fontSize: strong ? 11 : 10.5, fontWeight: strong ? 700 : 500, color:fg,
                      overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis' }}>{label}</div>
        <div style={{ fontSize: strong ? 10 : 9.5, color:fg, opacity: strong ? 1 : 0.85 }}>{item.time}</div>
        {branches.length > 0 && item.kind !== 'blocked' && (
          <div style={{ fontSize:8.5, color:fg, opacity:0.9, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis' }}>
            {branchName(branches, item.br) || (branchesOn ? '⚠ ללא שלוחה' : '')}
          </div>
        )}
      </div>
    );
  }

  async function assign(stu) {
    if (busy) return;
    setBusy(true);
    const ok = await addLesson(stu.id, assigning.date, assigning.time);
    setBusy(false);
    if (ok) setAssigning(null);
  }

  const selLesson = selected?.kind === 'lesson' ? selected.lesson : null;
  const selStu    = selLesson ? students.find(s => s.id === selLesson.sid) : null;
  const selLive   = selLesson && isLive(selLesson.status);

  return (
    <div>
      <div style={{ ...S.row, justifyContent:'space-between', marginBottom:10, flexWrap:'wrap', gap:8 }}>
        <div style={{ ...S.row, gap:12, flexWrap:'wrap' }}>
          {[['#dbeafe','#93c5fd','שיעור'],['#f5fdfb','#b7e4db','פנוי'],['#fffbeb','#fde68a','חריגה'],['#fef2f2','#fca5a5','חסום']].map(([bg,bd,l]) => (
            <div key={l} style={{ ...S.row, gap:4 }}>
              <div style={{ width:10, height:10, borderRadius:2, background:bg, border:`1px solid ${bd}` }} />
              <span style={{ fontSize:11, color:'var(--color-text-secondary)' }}>{l}</span>
            </div>
          ))}
        </div>
        <button style={{ ...S.btn('warning'), padding:'6px 12px', fontSize:12 }}
          onClick={() => { setExDi(parseD(TODAY).getDay()); setExT('09:00'); setAddingExtra(true); }}>
          ⭐ הוסף שעה חריגה השבוע
        </button>
      </div>
      <div style={{ fontSize:11, color:'var(--color-text-secondary)', marginBottom:8, textAlign:'center' }}>
        לחיצה על שעה פנויה — שיבוץ תלמיד · לחיצה על שטח ריק בלוח — הוספת שעה חריגה
      </div>

      <WeekCalendar days={teachingDays} items={items} renderItem={renderItem}
        onColumnClick={(di, date, timeStr) => { setExDi(di); setExT(timeStr); setAddingExtra(true); }} />

      {selected && (
        <Modal onClose={() => setSelected(null)}>
          <div style={{ fontSize:17, fontWeight:600, marginBottom:6, direction:'rtl' }}>
            {selLesson ? (selStu?.name || 'תלמיד שנמחק')
              : selected.kind === 'blocked' ? '🚫 שעה חסומה' : 'שעה פנויה'}
          </div>
          <div style={{ fontSize:14, color:'var(--color-text-secondary)', marginBottom:14, direction:'rtl' }}>
            יום {DAY_HE[selected.di]} · {dd(selected.date)} · {selected.time}
            <HolBadge date={selected.date} />
          </div>

          {branches.length > 0 && selected.kind !== 'blocked' && (
            <div style={{ background:'var(--color-background-secondary)', borderRadius:8, padding:'10px 12px', marginBottom:12, direction:'rtl' }}>
              <BranchSelect branches={branches} value={selected.br}
                onChange={br => { setSlotBranch(selected.di, selected.time, br); setSelected({ ...selected, br }); }} />
              <div style={{ fontSize:11, color:'var(--color-text-secondary)', lineHeight:1.5, marginTop:-4 }}>
                {branchesOn && !selected.br
                  ? '⚠ בלי שלוחה השעה הזו לא מוצגת לאף תלמיד.'
                  : 'שינוי כאן משנה את השעה הקבועה, בכל השבועות.'}
              </div>
            </div>
          )}

          {selLesson && <StatusBadge status={selLesson.status} />}
          {selLesson?.reason && <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'10px 0 0', direction:'rtl' }}>סיבה: {selLesson.reason}</p>}
          {(selLesson?.status === 'pending_cancel' || selLesson?.status === 'pending_move') && (
            <div style={{ background:'var(--color-background-warning)', borderRadius:8, padding:'10px 12px', marginTop:12, direction:'rtl' }}>
              <div style={{ fontSize:13, color:'var(--color-text-warning)' }}>
                {selLesson.status === 'pending_move' ? 'בקשת העברה ממתינה' : 'בקשת ביטול ממתינה'} — עבור ללשונית <strong>בקשות</strong>
              </div>
            </div>
          )}

          {selected.kind === 'free' && (
            <>
              {selected.freedBy && (
                <p style={{ fontSize:12.5, color:'var(--color-text-secondary)', margin:'0 0 12px', direction:'rtl' }}>
                  השעה התפנתה — {selected.freedBy} לא מגיע השבוע.
                </p>
              )}
              {hoursUntil(selected.date, selected.time) <= 0 ? (
                <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'6px 0 14px', direction:'rtl' }}>השעה הזו כבר עברה.</p>
              ) : (
                <button style={{ ...S.btn('primary'), width:'100%', marginBottom:8 }}
                  onClick={() => { setAssigning({ date:selected.date, time:selected.time, di:selected.di }); setSelected(null); }}>
                  ＋ שבץ תלמיד לשעה זו
                </button>
              )}
              {selected.isExtra ? (
                <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8 }}
                  onClick={() => { setWeekExtra(THIS_WK, selected.di, selected.time, false); setSelected(null); }}>
                  🗑 הסר את השעה החריגה
                </button>
              ) : (
                <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8 }}
                  onClick={() => { setWeekBlock(THIS_WK, selected.di, selected.time, true); setSelected(null); }}>
                  🚫 חסום את השעה הזו השבוע
                </button>
              )}
            </>
          )}

          {selected.kind === 'blocked' && (
            <>
              <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'6px 0 14px', direction:'rtl' }}>
                השעה חסומה השבוע ומוצגת לתלמידים כחסומה.
              </p>
              <button style={{ ...S.btn('success'), width:'100%', marginBottom:8 }}
                onClick={() => { setWeekBlock(THIS_WK, selected.di, selected.time, false); setSelected(null); }}>
                ↩️ בטל את החסימה
              </button>
            </>
          )}

          {selLive && (
            <>
              {/* Cancelling and blocking are different intentions: one hands the
                  hour back to the pool, the other closes it. Assign the wrong
                  student and you want the first one. */}
              <button style={{ ...S.btn('warning'), width:'100%', margin:'16px 0 8px' }}
                onClick={() => {
                  if (!confirm(`לבטל את השיעור של ${selStu?.name || 'התלמיד'} ביום ${DAY_HE[selected.di]} ${selected.time}? השעה תחזור להיות פנויה.`)) return;
                  updLesson(selLesson.id, { status:'teacher_cancelled' });
                  setSelected(null);
                }}>
                ✖ בטל את השיעור — השעה תחזור להיות פנויה
              </button>
              <button style={{ ...S.btn('danger'), width:'100%' }}
                onClick={() => {
                  if (!confirm(`לחסום את יום ${DAY_HE[selected.di]} ${selected.time}? השיעור של ${selStu?.name || 'התלמיד'} יבוטל והשעה תיסגר.`)) return;
                  setWeekBlock(THIS_WK, selected.di, selected.time, true);
                  setSelected(null);
                }}>
                🚫 אני לא מגיע — בטל וחסום את השעה
              </button>
            </>
          )}

          <button style={{ ...S.btn('ghost'), marginTop:14, width:'100%' }} onClick={() => setSelected(null)}>סגור</button>
        </Modal>
      )}

      {assigning && (
        <AssignStudentPicker slot={assigning} students={students} lessons={lessons} busy={busy} branches={branches}
          onAssign={assign} onClose={() => { if (!busy) setAssigning(null); }} />
      )}

      {addingExtra && (
        <Modal onClose={() => setAddingExtra(false)}>
          <h3 style={{ margin:'0 0 6px', fontSize:16, fontWeight:600, direction:'rtl' }}>⭐ שעה חריגה השבוע</h3>
          <p style={{ fontSize:12.5, color:'var(--color-text-secondary)', margin:'0 0 14px', direction:'rtl', lineHeight:1.6 }}>
            שעה חד-פעמית לשבוע הזה בלבד. היא תופיע בלוח כשעה פנויה — גם אצלך לשיבוץ וגם אצל התלמידים.
          </p>
          <div style={{ marginBottom:12 }}>
            <div style={S.label}>יום</div>
            <select style={S.input} value={exDi} onChange={e => setExDi(Number(e.target.value))}>
              {[0,1,2,3,4,5].map(di => (
                <option key={di} value={di}>יום {DAY_HE[di]} · {dd(dateOfDi(THIS_WK, di))}</option>
              ))}
            </select>
          </div>
          <div style={{ marginBottom:8 }}>
            <div style={S.label}>שעת התחלה (צעדים של 5 דקות)</div>
            <input type="time" step="300" style={S.input} value={exT} onChange={e => setExT(e.target.value)} />
          </div>
          <BranchSelect branches={branches} value={exBr} onChange={setExBr} />
          <div style={{ fontSize:12, color:'var(--color-text-secondary)', marginBottom:16, direction:'rtl' }}>
            שיעור: {exT} – {endTime(exT)} (45 דקות)
            {hoursUntil(dateOfDi(THIS_WK, exDi), exT) <= 0 && <span style={{ color:'var(--color-text-warning)' }}> · השעה הזו כבר עברה</span>}
          </div>
          <div style={{ ...S.row, justifyContent:'space-between' }}>
            <button style={S.btn('ghost')} onClick={() => setAddingExtra(false)}>ביטול</button>
            <button style={S.btn('primary')} onClick={saveExtra}>הוסף שעה</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Teacher: Next Week ────────────────────────────────────────────────────────
// ALL weekdays (0-4, Sun-Thu) always visible for easy extra-slot adding.
// Tap empty area → pre-filled extra slot modal.
// Block/remove options for ALL slot types including empty slots.
function TeacherNextWeekTab({ ctx }) {
  const { students, lessons, NEXT_WK, pubNext, updLesson, addLesson, pubWeek, baseSlots, addBaseSlot, removeBaseSlot, moveBaseSlot, clearPublishedWeek, fixOrphanedSlot, branches = [], branchesOn = false } = ctx;
  const [cancelledIds, setCancelledIds] = useState(pubNext?.cancelledIds || []);
  const [blockedSlots, setBlockedSlots] = useState(pubNext?.blockedSlots || []);
  const [extraSlots, setExtraSlots]     = useState(pubNext?.extraSlots   || []);
  const [note, setNote]                 = useState(pubNext?.note         || '');
  const [wasPublished, setWasPublished] = useState(!!pubNext);
  const [addingSlot,     setAddingSlot]     = useState(false);
  const [addingOpenSlot, setAddingOpenSlot] = useState(false);
  const [resetConfirm,   setResetConfirm]   = useState(false);
  const [movingSlot,    setMovingSlot]    = useState(null); // {di, t, sid}
  const [moveToDi,      setMoveToDi]      = useState(1);
  const [moveToT,       setMoveToT]       = useState('09:00');
  const [newSlotDi, setNewSlotDi]       = useState(1);
  const [newSlotT, setNewSlotT]         = useState('13:00');
  const [selected, setSelected]         = useState(null);
  const [assigning, setAssigning]       = useState(null); // {date,time,di}
  const [busy, setBusy]                 = useState(false);
  const [newSlotBr, setNewSlotBr]       = useState(null);

  // Always show Sunday(0) → Thursday(4), plus any extra-slot days
  const teachingDays = useMemo(() => {
    const diSet = new Set([0, 1, 2, 3, 4, ...extraSlots.map(s => s.di)]);
    return [...diSet].sort().map(di => {
      let d = parseD(NEXT_WK);
      while (d.getDay() !== di) d.setDate(d.getDate() + 1);
      return { date: fmtD(d), di };
    });
  }, [NEXT_WK, extraSlots]);

  // Build calendar items: base slots + extra slots
  const calItems = useMemo(() => {
    const items = [];
    const used = new Set();

    slotsForWeek(baseSlots, NEXT_WK).forEach(slot => {
      let d = parseD(NEXT_WK);
      while (d.getDay() !== slot.di) d.setDate(d.getDate() + 1);
      const date = fmtD(d);
      const key = `${date}_${slot.t}`;
      if (used.has(key)) return;
      used.add(key);
      const isBlocked  = blockedSlots.some(b => b.di===slot.di && b.t===slot.t);
      const isCancelled= slot.sid ? cancelledIds.includes(slot.sid) : false;
      const fixedStu   = slot.sid ? students.find(s => s.id===slot.sid) : null;
      const lesson     = lessons.find(l => l.date===date && l.time===slot.t && isLive(l.status));
      const bookedStu  = lesson ? students.find(s => s.id===lesson.sid) : null;
      const flexStu    = bookedStu && bookedStu.id !== (slot.sid || '') ? bookedStu : null;
      const isOrphaned = !!(slot.sid && !fixedStu);
      const isPermOpen = !slot.sid || isOrphaned;  // orphaned slots treated as open
      items.push({ id:key, date, time:slot.t, di:slot.di, br:slot.br || null, lesson, fixedStu, flexStu, isCancelled, isBlocked, isExtra:false, isPermOpen, isOrphaned, isEmpty:!fixedStu&&!lesson&&!isBlocked&&!isOrphaned });
    });

    extraSlots.forEach(slot => {
      let d = parseD(NEXT_WK);
      while (d.getDay() !== slot.di) d.setDate(d.getDate() + 1);
      const date = fmtD(d);
      const key = `extra_${date}_${slot.t}`;
      if (used.has(key)) return;
      used.add(key);
      const lesson   = lessons.find(l => l.date===date && l.time===slot.t && isLive(l.status));
      const bookedStu= lesson ? students.find(s => s.id===lesson.sid) : null;
      items.push({ id:key, date, time:slot.t, di:slot.di, br:slot.br || null, lesson, fixedStu:null, flexStu:bookedStu||null, isCancelled:false, isBlocked:false, isExtra:true, isEmpty:!lesson });
    });

    // Also show lessons that exist in Firestore but have no matching baseSlot or extraSlot
    // (e.g. one-time lessons added after the slot was deleted from baseSlots)
    lessons.forEach(lesson => {
      if (!isLive(lesson.status)) return;
      if (!inWk(lesson.date, NEXT_WK)) return;
      const key = `${lesson.date}_${lesson.time}`;
      const extraKey = `extra_${lesson.date}_${lesson.time}`;
      if (used.has(key) || used.has(extraKey)) return;
      if (!isValidTime(lesson.time)) return;
      const bookedStu = students.find(s => s.id === lesson.sid);
      if (!bookedStu) return; // ghost lesson, skip
      const ld = parseD(lesson.date);
      const di = ld.getDay();
      used.add(key);
      items.push({ id:key, date:lesson.date, time:lesson.time, di, lesson, fixedStu:null, flexStu:bookedStu, isCancelled:false, isBlocked:false, isExtra:true, isPermOpen:false, isOrphaned:false, isEmpty:false });
    });

    return items;
  }, [NEXT_WK, lessons, students, cancelledIds, blockedSlots, extraSlots, baseSlots]);

  function renderItem(item, top, height) {
    const showBlocked    = item.isBlocked;
    const showFixed      = item.fixedStu && !item.isCancelled && !item.isBlocked && !item.flexStu;
    const showFlex       = !!item.flexStu && !item.isBlocked;
    const showCancelled  = item.fixedStu && item.isCancelled && !item.flexStu && !item.isBlocked;
    const showExtraEmpty = item.isExtra && item.isEmpty && !item.isBlocked;
    let bg,fg,border,label;
    const showPermOpen = item.isPermOpen && !item.isOrphaned && !item.flexStu && !item.isBlocked;
    const showOrphaned = item.isOrphaned && !item.isBlocked;
    if (showBlocked)     { bg='#fee2e2'; fg='#991b1b'; border='#fca5a5'; label='🚫 חסום'; }
    else if (showFixed)      { bg='#dbeafe'; fg='#1e40af'; border='#93c5fd'; label=item.fixedStu.name; }
    else if (showFlex)       { bg='#dcfce7'; fg='#166534'; border='#86efac'; label=item.flexStu.name; }
    else if (showCancelled)  { bg='#f1f5f9'; fg='#94a3b8'; border='#cbd5e1'; label=`${item.fixedStu.name} (הוסר)`; }
    else if (showExtraEmpty) { bg='#fef9c3'; fg='#78350f'; border='#fde68a'; label='⭐ חריגה'; }
    else if (showOrphaned)   { bg='#ffedd5'; fg='#9a3412'; border='#fed7aa'; label='⚠️ שעה עם תלמיד שנמחק'; }
    else if (showPermOpen)   { bg='#ccfbf1'; fg='#0f766e'; border='#5eead4'; label='🔓 פנוי קבוע'; }
    else                     { bg='#f8fafc'; fg='#cbd5e1'; border='#e2e8f0'; label='פנוי'; }
    return (
      <div key={item.id} onClick={e => { e.stopPropagation(); setSelected(item); }} style={{
        position:'absolute', top, left:2, right:2, height,
        background:bg, border:`1px solid ${border}`, borderRadius:5,
        padding:'3px 5px', cursor:'pointer', overflow:'hidden',
        opacity:(showCancelled||showBlocked)?0.55:1,
      }}>
        <div style={{ fontSize:11, fontWeight:700, color:fg, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis' }}>{label}</div>
        <div style={{ fontSize:10, color:fg }}>{item.time}</div>
        {branches.length > 0 && !showBlocked && (
          <div style={{ fontSize:8.5, color:fg, opacity:0.9, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis' }}>
            {branchName(branches, item.br) || (branchesOn ? '⚠ ללא שלוחה' : '')}
          </div>
        )}
      </div>
    );
  }

  function handleColumnClick(di, date, timeStr) {
    setNewSlotDi(di); setNewSlotT(timeStr); setAddingSlot(true);
  }

  function handleAction(action) {
    if (!selected) return;
    if (action === 'block_slot') {
      setBlockedSlots(bs => [...bs.filter(b => !(b.di===selected.di&&b.t===selected.time)), { di:selected.di, t:selected.time }]);
      if (selected.fixedStu) setCancelledIds(ids => ids.includes(selected.fixedStu.id) ? ids : [...ids, selected.fixedStu.id]);
    } else if (action === 'remove_student') {
      if (selected.fixedStu) setCancelledIds(ids => [...ids, selected.fixedStu.id]);
    } else if (action === 'restore_fixed') {
      setCancelledIds(ids => ids.filter(id => id !== selected.fixedStu?.id));
      setBlockedSlots(bs => bs.filter(b => !(b.di===selected.di&&b.t===selected.time)));
    } else if (action === 'unblock_slot') {
      setBlockedSlots(bs => bs.filter(b => !(b.di===selected.di&&b.t===selected.time)));
    } else if (action === 'remove_flex') {
      if (selected.lesson) updLesson(selected.lesson.id, { status:'teacher_cancelled' });
    } else if (action === 'remove_extra') {
      setExtraSlots(es => es.filter(e => !(e.di===selected.di&&e.t===selected.time)));
    } else if (action === 'delete_permanent') {
      removeBaseSlot(selected.di, selected.time, NEXT_WK);
    } else if (action === 'fix_orphaned') {
      ctx.fixOrphanedSlot(selected.di, selected.time);
    }
    setSelected(null);
  }

  function doPublish() {
    pubWeek(NEXT_WK, cancelledIds, blockedSlots, extraSlots, note);
    setWasPublished(true);
  }

  function addExtraSlot() {
    if (!isValidTime(newSlotT)) { alert('שעה לא תקינה — בחר שעה בין 07:00 ל-21:00'); return; }
    if (branches.length && !newSlotBr &&
        !confirm('לא בחרת שלוחה לשעה הזו. בזמן שהשלוחות פעילות היא לא תוצג לאף תלמיד. להוסיף בכל זאת?')) return;
    if (!extraSlots.find(e => e.di===newSlotDi && e.t===newSlotT)) {
      setExtraSlots(es => [...es, { di:newSlotDi, t:newSlotT, br:newSlotBr || null }]);
    }
    setAddingSlot(false);
  }

  const dayOptions = [0,1,2,3,4,5].map(di => ({ value:di, label:`יום ${DAY_HE[di]}` }));

  // End-time helper
  function endTime(t) {
    const [h,m] = t.split(':').map(Number);
    const e = h*60+m+45;
    return `${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`;
  }

  return (
    <div>
      {/* Publish bar */}
      <div style={{ ...S.card, border:'1.5px solid #B5D4F4', background:'#f8fbff', marginBottom:10 }}>
        <div style={{ ...S.row, justifyContent:'space-between', marginBottom:8 }}>
          <span style={{ fontSize:13, fontWeight:600, color:'#185FA5' }}>
            שבוע {dd(NEXT_WK)} – {dd(addDays(NEXT_WK,6))}
            {wasPublished && <span style={{ ...S.badge('success'), marginRight:8 }}>פורסם ✓</span>}
          </span>
        </div>
        <div style={S.label}>הערה לתלמידים (אופציונלי)</div>
        <textarea style={{ ...S.input, minHeight:48, resize:'vertical', marginBottom:10 }}
          placeholder="למשל: ביום שלישי אני זמין גם בערב..."
          value={note} onChange={e => setNote(e.target.value)} />
        <div style={{ ...S.row, justifyContent:'space-between' }}>
          {/* Prominent "+ שעה חריגה" button */}
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <button style={{ ...S.btn('info'), display:'flex', alignItems:'center', gap:6, fontWeight:600 }} onClick={() => setAddingSlot(true)}>
              ＋ שעה חריגה
            </button>
            <button style={{ ...S.btn('success'), display:'flex', alignItems:'center', gap:6, fontWeight:600, background:'#ccfbf1', color:'#0f766e', borderColor:'#5eead4' }} onClick={() => setAddingOpenSlot(true)}>
              ＋ שעה פנויה קבועה
            </button>
          </div>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <button style={{ ...S.btn('ghost'), padding:'6px 14px', fontSize:13, color:'#dc2626', border:'1.5px solid #fca5a5' }}
              onClick={() => setResetConfirm(true)}>🗑 נקה הכל</button>
            <button style={S.btn('primary')} onClick={doPublish}>
              {wasPublished ? 'עדכן פרסום' : 'פרסם לתלמידים'}
            </button>
          </div>
        </div>
      </div>

      {/* Legend */}
      <div style={{ ...S.row, gap:8, marginBottom:8, flexWrap:'wrap' }}>
        {[['#dbeafe','#1e40af','קבוע'],['#dcfce7','#166534','נרשם'],['#ccfbf1','#0f766e','פנוי קבוע (כל שבוע)'],['#f8fafc','#cbd5e1','פנוי'],['#f1f5f9','#94a3b8','הוסר'],['#fee2e2','#991b1b','חסום'],['#fef9c3','#78350f','חריגה'],['#ffedd5','#9a3412','⚠️ תלמיד שנמחק']].map(([bg,fg,l]) => (
          <div key={l} style={{ ...S.row, gap:3 }}>
            <div style={{ width:9, height:9, borderRadius:2, background:bg, border:`1px solid ${fg}`, flexShrink:0 }} />
            <span style={{ fontSize:10, color:'var(--color-text-secondary)' }}>{l}</span>
          </div>
        ))}
      </div>
      <div style={{ fontSize:11, color:'var(--color-text-secondary)', marginBottom:8, textAlign:'center' }}>
        לחץ על שעה קיימת לפעולות · לחץ על שטח ריק להוספת שעה חריגה
      </div>


      {/* ── Hidden / out-of-hours base slots warning ── */}
      {slotsForWeek(baseSlots, NEXT_WK).filter(s => !isValidTime(s.t)).length > 0 && (
        <div style={{ ...S.card, background:'#fff7ed', border:'1.5px solid #fed7aa', marginBottom:10 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#9a3412', marginBottom:8 }}>
            ⚠️ שעות חסויות מחוץ לשעות הפעילות
          </div>
          <div style={{ fontSize:12, color:'#9a3412', marginBottom:10 }}>
            השעות הבאות אינן מוצגות בלוח (לפני 07:00 או אחרי 21:00) אך גלויות לתלמידים. מחק אותן:
          </div>
          {slotsForWeek(baseSlots, NEXT_WK).filter(s => !isValidTime(s.t)).map(s => (
            <div key={`${s.di}_${s.t}`} style={{ ...S.row, justifyContent:'space-between', marginBottom:6, background:'#ffedd5', borderRadius:6, padding:'6px 10px' }}>
              <span style={{ fontSize:13, color:'#7c2d12' }}>
                יום {DAY_HE[s.di]} · {s.t}
                {s.sid ? ` · ${students.find(st=>st.id===s.sid)?.name||s.sid}` : ' · פנוי'}
              </span>
              <button style={{ ...S.btn('danger'), padding:'3px 10px', fontSize:12 }}
                onClick={() => removeBaseSlot(s.di, s.t, NEXT_WK)}>
                🗑 מחק
              </button>
            </div>
          ))}
        </div>
      )}

      <WeekCalendar days={teachingDays} items={calItems} renderItem={renderItem} onColumnClick={handleColumnClick} />



      {/* ── Slot action modal ── */}
      {selected && (
        <Modal onClose={() => setSelected(null)}>
          <div style={{ fontSize:15, fontWeight:600, marginBottom:4, direction:'rtl' }}>
            יום {DAY_HE[selected.di]} · {selected.time}
            {branches.length > 0 && <> <BranchTag branches={branches} br={selected.br} warn={branchesOn} /></>}
          </div>

          {selected.isBlocked && (
            <>
              <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'6px 0 14px', direction:'rtl' }}>השעה חסומה — אף תלמיד לא יכול לתפוס אותה</p>
              <button style={{ ...S.btn('success'), width:'100%', marginBottom:8 }} onClick={() => handleAction('unblock_slot')}>בטל חסימה</button>
            </>
          )}

          {/* Free next week — fill it here rather than going into the student */}
          {!selected.isBlocked && !selected.flexStu && !selected.isOrphaned &&
           ((selected.isPermOpen) || (selected.isExtra && selected.isEmpty) || (selected.fixedStu && selected.isCancelled)) && (
            <button style={{ ...S.btn('primary'), width:'100%', marginBottom:12 }}
              onClick={() => { setAssigning({ date:selected.date, time:selected.time, di:selected.di }); setSelected(null); }}>
              ＋ שבץ תלמיד לשעה זו
            </button>
          )}

          {/* Fixed student, active */}
          {selected.fixedStu && !selected.isCancelled && !selected.isBlocked && !selected.flexStu && (
            <>
              <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'6px 0 10px', direction:'rtl' }}>שיעור קבוע: <strong>{selected.fixedStu.name}</strong></p>
              <div style={{ background:'var(--color-background-secondary)', borderRadius:8, padding:'10px 12px', marginBottom:10, direction:'rtl' }}>
                <button style={{ ...S.btn('info'), width:'100%', marginBottom:8, textAlign:'right' }} onClick={() => { setMovingSlot({di:selected.di, t:selected.time, sid:selected.fixedStu.id}); setMoveToDi(selected.di); setMoveToT(selected.time); setSelected(null); }}>
                  <div style={{ fontWeight:600 }}>✏️ שנה שעה לצמיתות</div>
                  <div style={{ fontSize:11, fontWeight:400, opacity:0.8, marginTop:2 }}>יחול מהשבוע הבא ואילך על {selected.fixedStu.name}</div>
                </button>
                <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8, textAlign:'right' }} onClick={() => handleAction('block_slot')}>
                  <div style={{ fontWeight:600 }}>🚫 חסום שבוע הבא בלבד</div>
                  <div style={{ fontSize:11, fontWeight:400, opacity:0.8, marginTop:2 }}>אף תלמיד לא יוכל לתפוס את השעה הזו</div>
                </button>
                <button style={{ ...S.btn('warning'), width:'100%', marginBottom:8, textAlign:'right' }} onClick={() => handleAction('remove_student')}>
                  <div style={{ fontWeight:600 }}>הסר תלמיד לשבוע הבא</div>
                  <div style={{ fontSize:11, fontWeight:400, opacity:0.8, marginTop:2 }}>השעה תישאר פתוחה לתלמיד נייד</div>
                </button>
                <button style={{ ...S.btn('danger'), width:'100%', textAlign:'right' }} onClick={() => handleAction('delete_permanent')}>
                  <div style={{ fontWeight:600 }}>🗑 בטל שיעור קבוע לצמיתות</div>
                  <div style={{ fontSize:11, fontWeight:400, opacity:0.8, marginTop:2 }}>מהשבוע הבא ואילך. השבוע הנוכחי לא ישתנה.</div>
                </button>
              </div>
            </>
          )}

          {/* Fixed student, removed */}
          {selected.fixedStu && selected.isCancelled && !selected.isBlocked && !selected.flexStu && (
            <>
              <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'6px 0 14px', direction:'rtl' }}>
                <strong>{selected.fixedStu.name}</strong> — הוסר · השעה פתוחה לאחרים
              </p>
              <button style={{ ...S.btn('success'), width:'100%', marginBottom:8 }} onClick={() => handleAction('restore_fixed')}>שחזר תלמיד לשעה</button>
              <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8 }} onClick={() => handleAction('block_slot')}>🚫 חסום שעה לחלוטין</button>
            </>
          )}

          {/* Flex student booked */}
          {selected.flexStu && !selected.isBlocked && (
            <>
              <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'6px 0 14px', direction:'rtl' }}>
                נרשם: <strong>{selected.flexStu.name}</strong>
                {selected.fixedStu && <span style={{ color:'#94a3b8' }}> (הקבוע הוסר)</span>}
              </p>
              <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8 }} onClick={() => handleAction('remove_flex')}>הסר מהשעה</button>
            </>
          )}

          {/* Extra empty slot */}
          {selected.isExtra && selected.isEmpty && !selected.isBlocked && (
            <>
              <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'6px 0 14px', direction:'rtl' }}>שעה חריגה — פנויה</p>
              <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8 }} onClick={() => handleAction('remove_extra')}>🗑 הסר שעה חריגה</button>
            </>
          )}

          {/* Orphaned slot — sid points to deleted student */}
          {selected.isOrphaned && !selected.isBlocked && (
            <>
              <div style={{ background:'#fff7ed', borderRadius:8, padding:'10px 12px', marginBottom:10, direction:'rtl' }}>
                <div style={{ fontSize:13, fontWeight:600, color:'#9a3412', marginBottom:4 }}>⚠️ שעה עם תלמיד שנמחק</div>
                <div style={{ fontSize:12, color:'#9a3412' }}>השעה הזו שייכת לתלמיד שכבר לא קיים במערכת. יש להחליט מה לעשות:</div>
              </div>
              <button style={{ ...S.btn('success'), width:'100%', marginBottom:8, textAlign:'right' }}
                onClick={() => handleAction('fix_orphaned')}>
                <div style={{ fontWeight:600 }}>🔓 הפוך לשעה פנויה קבועה</div>
                <div style={{ fontSize:11, fontWeight:400, marginTop:2, opacity:0.8 }}>השעה תופיע בלוח כל שבוע לתלמידים ניידים</div>
              </button>
              <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8, textAlign:'right' }}
                onClick={() => handleAction('delete_permanent')}>
                <div style={{ fontWeight:600 }}>🗑 מחק שעה לצמיתות</div>
                <div style={{ fontSize:11, fontWeight:400, marginTop:2, opacity:0.8 }}>השעה תיעלם מהלוח לחלוטין</div>
              </button>
            </>
          )}

          {/* Open slot (no student) */}
          {selected.isPermOpen && !selected.isOrphaned && !selected.flexStu && !selected.isBlocked && (
            <>
              <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'6px 0 14px', direction:'rtl' }}>שעה פנויה קבועה — מופיעה כל שבוע. שינוי כאן חל מהשבוע הבא ואילך.</p>
              <button style={{ ...S.btn('primary'), width:'100%', marginBottom:8 }} onClick={() => { setMovingSlot({di:selected.di, t:selected.time, sid:null}); setMoveToDi(selected.di); setMoveToT(selected.time); setSelected(null); }}>✏️ שנה שעה/יום לצמיתות</button>
              <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8 }} onClick={() => handleAction('block_slot')}>🚫 חסום השבוע הבא בלבד</button>
              <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8 }} onClick={() => handleAction('delete_permanent')}>🗑 מחק שעה לצמיתות</button>
            </>
          )}



          <button style={{ ...S.btn('ghost'), width:'100%' }} onClick={() => setSelected(null)}>סגור</button>
        </Modal>
      )}

      {/* ── Reset confirmation modal ── */}
      {resetConfirm && (
        <Modal onClose={() => setResetConfirm(false)}>
          <h3 style={{ margin:'0 0 12px', fontSize:16, fontWeight:600, direction:'rtl', color:'#dc2626' }}>⚠️ איפוס שבוע הבא</h3>
          <p style={{ fontSize:13, color:'var(--color-text-secondary)', marginBottom:16, direction:'rtl', lineHeight:1.6 }}>
            פעולה זו תאפס את שבוע הבא בלבד:<br/>
            • <strong>שעות חריגות</strong> — יוסרו<br/>
            • <strong>חסימות וביטולי תלמידים</strong> — יבוטלו<br/>
            • <strong>הפרסום לתלמידים</strong> — יבוטל<br/>
            <span style={{ fontSize:11, opacity:0.7 }}>המשבצות הפנויות הקבועות לא ייפגעו</span>
          </p>
          <button style={{ ...S.btn('danger'), width:'100%', marginBottom:8 }}
            onClick={() => {
              setExtraSlots([]);
              setBlockedSlots([]);
              setCancelledIds([]);
              setNote('');
              setWasPublished(false);
              clearPublishedWeek(NEXT_WK);
              setResetConfirm(false);
            }}>
            🗑 כן, אפס שבוע הבא
          </button>
          <button style={{ ...S.btn('ghost'), width:'100%' }} onClick={() => setResetConfirm(false)}>ביטול</button>
        </Modal>
      )}

      {/* ── Edit / move slot modal ── */}
      {movingSlot && (
        <Modal onClose={() => setMovingSlot(null)}>
          <h3 style={{ margin:'0 0 6px', fontSize:16, fontWeight:600, direction:'rtl' }}>✏️ שינוי שעה קבועה</h3>
          <p style={{ fontSize:12, color:'var(--color-text-secondary)', marginBottom:4, direction:'rtl' }}>
            {DAY_HE[movingSlot.di]} · {movingSlot.t}
            {movingSlot.sid && <span style={{ color:'var(--color-text-info)', fontWeight:600 }}> · {students.find(s=>s.id===movingSlot.sid)?.name}</span>}
          </p>
          {movingSlot.sid && (
            <div style={{ background:'var(--color-background-info)', borderRadius:8, padding:'8px 12px', marginBottom:12, fontSize:12, color:'var(--color-text-info)', direction:'rtl' }}>
              שיעורי התלמיד יועברו לשעה החדשה מהשבוע הבא ואילך
            </div>
          )}
          <div style={{ marginBottom:12 }}>
            <div style={S.label}>יום חדש</div>
            <select style={S.input} value={moveToDi} onChange={e => setMoveToDi(Number(e.target.value))}>
              {dayOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </div>
          <div style={{ marginBottom:16 }}>
            <div style={S.label}>שעה חדשה</div>
            <input type="time" step="300" style={S.input} value={moveToT} onChange={e => setMoveToT(e.target.value)} />
          </div>
          <div style={{ fontSize:12, color:'var(--color-text-secondary)', marginBottom:16, direction:'rtl' }}>
            שיעור: {moveToT} – {endTime(moveToT)} (45 דקות)
          </div>
          <button style={{ ...S.btn('primary'), width:'100%', marginBottom:8 }}
            onClick={() => {
              if (!isValidTime(moveToT)) { alert('שעה לא תקינה — בחר שעה בין 07:00 ל-21:00'); return; }
              moveBaseSlot(movingSlot.di, movingSlot.t, moveToDi, moveToT, undefined, NEXT_WK);
              setMovingSlot(null);
            }}>
            ✅ שמור שינוי
          </button>
          <button style={{ ...S.btn('ghost'), width:'100%' }} onClick={() => setMovingSlot(null)}>ביטול</button>
        </Modal>
      )}

      {/* ── Add permanent open slot modal ── */}
      {addingOpenSlot && (
        <Modal onClose={() => setAddingOpenSlot(false)}>
          <h3 style={{ margin:'0 0 4px', fontSize:16, fontWeight:500, direction:'rtl' }}>הוסף שעה פנויה קבועה</h3>
          <p style={{ margin:'0 0 14px', fontSize:12, color:'var(--color-text-secondary)', direction:'rtl' }}>
            תתווסף מהשבוע הבא ואילך — השבוע הנוכחי נשאר כפי שפורסם.
          </p>
          <p style={{ fontSize:13, color:'var(--color-text-secondary)', margin:'0 0 14px', direction:'rtl' }}>
            השעה תופיע בלוח כל שבוע כשעה פתוחה לתלמידים ניידים.
          </p>
          <div style={{ marginBottom:12 }}>
            <div style={S.label}>יום</div>
            <select style={S.input} value={newSlotDi} onChange={e => setNewSlotDi(Number(e.target.value))}>
              {dayOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </div>
          <div style={{ marginBottom:8 }}>
            <div style={S.label}>שעת התחלה</div>
            <input type="time" step="300" style={S.input} value={newSlotT} onChange={e => setNewSlotT(e.target.value)} />
          </div>
          <BranchSelect branches={branches} value={newSlotBr} onChange={setNewSlotBr} />
          <div style={{ fontSize:12, color:'var(--color-text-secondary)', marginBottom:16, direction:'rtl' }}>
            שיעור: {newSlotT} – {endTime(newSlotT)} (45 דקות)
          </div>
          <div style={{ ...S.row, justifyContent:'space-between' }}>
            <button style={S.btn('ghost')} onClick={() => setAddingOpenSlot(false)}>ביטול</button>
            <button style={{ ...S.btn('success'), background:'#ccfbf1', color:'#0f766e', borderColor:'#5eead4' }}
              onClick={() => {
                if (!isValidTime(newSlotT)) { alert('שעה לא תקינה — בחר שעה בין 07:00 ל-21:00'); return; }
                addBaseSlot(newSlotDi, newSlotT, null, newSlotBr, NEXT_WK); setAddingOpenSlot(false);
              }}>
              🔓 הוסף שעה קבועה
            </button>
          </div>
        </Modal>
      )}

      {/* ── Add exceptional slot modal ── */}
      {addingSlot && (
