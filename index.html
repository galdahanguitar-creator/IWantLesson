                      </div>
                    </button>
                  );
                })}
                {movable.some(isLateMove) && (
                  <div style={{ background:'var(--color-background-warning)', borderRadius:8, padding:'10px 12px', marginBottom:12 }}>
                    <div style={{ fontSize:12.5, color:'var(--color-text-warning)', lineHeight:1.6 }}>
                      שיעור שמתחיל בעוד פחות מ-24 שעות — ההעברה טעונה אישור המורה.
                      השעה שביקשת נשמרת לך עד שהיא תענה.
                    </div>
                  </div>
                )}
                <p style={{ fontSize:11.5, color:'var(--color-text-secondary)', margin:'0 0 12px', lineHeight:1.6 }}>
                  השעה הישנה שלך תתפנה ותהיה פתוחה לתלמידים אחרים.
                </p>
              </>
            )}
            <button style={{ ...S.btn('ghost'), width:'100%' }} disabled={busy} onClick={() => setPick(null)}>ביטול</button>
          </div>
        </Modal>
      )}

      {sentRequest && (
        <Modal onClose={() => setSentRequest(null)}>
          <div style={{ direction:'rtl', textAlign:'center', padding:'4px 0' }}>
            <div style={{ fontSize:34, marginBottom:8 }}>⏳</div>
            <div style={{ fontSize:17, fontWeight:600, marginBottom:6 }}>הבקשה נשלחה למורה</div>
            <p style={{ fontSize:13.5, color:'var(--color-text-secondary)', margin:'0 0 6px', lineHeight:1.7 }}>
              ביקשת להעביר את השיעור מיום {DAY_HE[parseD(sentRequest.from.date).getDay()]} {dd(sentRequest.from.date)} · {sentRequest.from.time}
              <br/>ליום {DAY_HE[sentRequest.to.di]} {dd(sentRequest.to.date)} · {sentRequest.to.time}
            </p>
            <p style={{ fontSize:12, color:'var(--color-text-secondary)', margin:'0 0 16px', lineHeight:1.7 }}>
              עד שהמורה תאשר — השיעור המקורי שלך נשאר בתוקף, והשעה החדשה שמורה לך.
            </p>
            {waLink(teacherPhone, `היי, ביקשתי להעביר את השיעור שלי מיום ${DAY_HE[parseD(sentRequest.from.date).getDay()]} ${dd(sentRequest.from.date)} ${sentRequest.from.time} ליום ${DAY_HE[sentRequest.to.di]} ${dd(sentRequest.to.date)} ${sentRequest.to.time}. תודה!`) ? (
              <a href={waLink(teacherPhone, `היי, ביקשתי להעביר את השיעור שלי מיום ${DAY_HE[parseD(sentRequest.from.date).getDay()]} ${dd(sentRequest.from.date)} ${sentRequest.from.time} ליום ${DAY_HE[sentRequest.to.di]} ${dd(sentRequest.to.date)} ${sentRequest.to.time}. תודה!`)}
                 target="_blank" rel="noopener noreferrer"
                 style={{ ...S.btn('success'), width:'100%', display:'block', textDecoration:'none', padding:'12px', marginBottom:10, boxSizing:'border-box' }}>
                💬 הקפץ הודעה למורה בוואטסאפ
              </a>
            ) : null}
            <button style={{ ...S.btn('ghost'), width:'100%' }} onClick={() => setSentRequest(null)}>סגור</button>
          </div>
        </Modal>
      )}

      {contact && (
        <Modal onClose={() => setContact(null)}>
          <div style={{ textAlign:'center', direction:'rtl', padding:'4px 0' }}>
            <div style={{ fontSize:17, fontWeight:600, marginBottom:4 }}>{contact.name}</div>
            <div style={{ fontSize:14, color:'var(--color-text-secondary)', marginBottom:18 }}>
              יום {DAY_HE[contact.di]} · {dd(contact.date)} · {contact.time}
            </div>
            <a href={`https://wa.me/972${contact.phone.replace(/\D/g,'').replace(/^0/,'')}`}
               target="_blank" rel="noopener noreferrer"
               style={{ ...S.btn('success'), width:'100%', display:'block', textDecoration:'none',
                        padding:'12px', marginBottom:8, boxSizing:'border-box' }}>
              💬 שלח וואטסאפ לתיאום החלפה
            </a>
            <div style={{ fontSize:11.5, color:'var(--color-text-secondary)', marginBottom:14, lineHeight:1.6 }}>
              סיכמתם ביניכם? כל אחד מכם צריך לשנות את השעה שלו במערכת בעצמו,
              או לבקש מהמורה.
            </div>
            <button style={{ ...S.btn('ghost'), width:'100%' }} onClick={() => setContact(null)}>סגור</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// ROOT — auth, tenancy, and the Firestore data layer
// ─────────────────────────────────────────────────────────────────────────────
//
//  teachers/{tid}                      private: name, studio, slots, holidays
//  boards/{boardKey}_{weekStart}       published week — what students may see,
//                                      at an address only a student can know
//  claims/{boardKey}_{weekStart}       live slot claims made after publishing
//  students/{code}                     `code` is the doc id and the secret
//  students/{code}/lessons/{lessonId}  written only when something happened
//  pending_students/{autoId}           registration inbox, per teacher
//
//  No lesson is written ahead of time. The coming weeks are projected from the
//  teacher's recurring slots; a document appears only once a lesson was held,
//  cancelled, moved, or booked as a one-off. Moving a student to a different
//  hour is therefore one write, not eighty.
// ─────────────────────────────────────────────────────────────────────────────

const STORE_KEY = 'studio.studentCode';

function readStoredCode() {
  try { return localStorage.getItem(STORE_KEY) || ''; } catch (e) { return ''; }
}
function writeStoredCode(code) {
  try { code ? localStorage.setItem(STORE_KEY, code) : localStorage.removeItem(STORE_KEY); } catch (e) {}
}

// #register/<teacherId> · #s/<code> · #<code>
function parseRoute() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  if (!h) return { kind: 'none' };
  const [head, tail] = h.split('/');
  if (head === 'register') return { kind: 'register', teacherId: tail || '' };
  if (head === 's' && tail) return { kind: 'student', code: tail.toUpperCase() };
  if (/^[A-Z0-9]{4,10}$/i.test(head)) return { kind: 'student', code: head.toUpperCase() };
  return { kind: 'none' };
}

function MusicScheduler() {
  const [db,       setDb]       = useState(null);
  const [auth,     setAuth]     = useState(null);
  const [ready,    setReady]    = useState(false);   // anonymous session established
  const [fatal,    setFatal]    = useState('');
  const [fatalLink, setFatalLink] = useState('');

  const [teacherUid, setTeacherUid] = useState(null);
  const [teacher,    setTeacher]    = useState(null);
  const [students,   setStudents]   = useState([]);
  const [pendingStudents, setPendingStudents] = useState([]);
  const [realLessons, setRealLessons] = useState([]);
  const [lessonsLoaded, setLessonsLoaded] = useState(false);
  const [boards,     setBoards]     = useState({});
  const [claims,     setClaims]     = useState({});

  const [studentCode, setStudentCode] = useState(() => {
    const r = parseRoute();
    return r.kind === 'student' ? r.code : readStoredCode();
  });
  const [me,        setMe]        = useState(null);
  const [meError,   setMeError]   = useState('');
  const [approvedInfo, setApprovedInfo] = useState(null);
  const [roleNotice,   setRoleNotice]   = useState(false);

  const backfilledRef = useRef(false);
  // Signing out tears down the teacher's listeners, but they stay live for a
  // moment with no teacher credential — so Firestore rightly refuses them.
  // That refusal is expected, not a failure, and must not raise an error screen.
  const leavingRef = useRef(false);
  const route     = parseRoute();
  const isTeacher = !!teacherUid;
  const isStudent = !isTeacher && !!me;

  const TODAY   = todayS();
  const THIS_WK = wkStart(TODAY);
  const NEXT_WK = addDays(THIS_WK, 7);
  const PROJ_WEEKS = [THIS_WK, NEXT_WK, addDays(NEXT_WK, 7)];

  // ── refs ──────────────────────────────────────────────────────────────────
  const teacherRef = () => db.collection('teachers').doc(teacherUid);
  const studentRef = (sid) => db.collection('students').doc(sid);
  const lessonRef  = (sid, id) => studentRef(sid).collection('lessons').doc(id);
  const boardRef   = (key, ws) => db.collection('boards').doc(`${key}_${ws}`);
  const claimsRef  = (key, ws) => db.collection('claims').doc(`${key}_${ws}`);

  // ── boot: firebase + anonymous session ────────────────────────────────────
  useEffect(() => {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const fs = firebase.firestore();
    const au = firebase.auth();
    setDb(fs); setAuth(au);

    const unsub = au.onAuthStateChanged(async user => {
      if (!user) {
        try { await au.signInAnonymously(); }
        catch (e) {
          console.error(e);
          setFatal('לא ניתן להתחבר לשרת. ודא שהאימות האנונימי מופעל ב-Firebase Console.');
        }
        return;                       // the listener fires again with the new user
      }
      setTeacherUid(user.isAnonymous ? null : user.uid);
      setReady(true);
    });
    return unsub;
  }, []);

  // ── teacher subscriptions ─────────────────────────────────────────────────
  useEffect(() => {
    if (!db || !teacherUid) return;
    const subs = [];
    const tRef = db.collection('teachers').doc(teacherUid);

    subs.push(tRef.onSnapshot(async doc => {
      if (!doc.exists) {
        const email = auth?.currentUser?.email || '';
        await tRef.set({
          teacherId: teacherUid,
          name: email.split('@')[0] || 'מורה',
          studioName: 'אולפן מוסיקה',
          slots: [], holidays: DEFAULT_HOLIDAYS,
          // The board lives at an unguessable address rather than one derived
          // from the teacher id, because the teacher id travels in the public
          // registration link. Only someone handed a student code can find it.
          boardKey: genCode(12),
          lastSweep: null, createdAt: new Date().toISOString(),
        });
        return;
      }
      const data = doc.data();

      // Any slot missing `since` predates that field. Left unstamped it would
      // let the sweep project today's schedule onto past weeks. Stamp it once,
      // from the studio's own start date.
      const slots = data.slots || [];
      const needsKey   = !data.boardKey;
      const needsSince = slots.some(s => !s.since);
      if ((needsKey || needsSince) && !backfilledRef.current) {
        backfilledRef.current = true;
        const patch = {};
        // A teacher document created before boards moved has no key. Without
        // this the board would be written to "undefined_<week>" — a guessable
        // address shared by every such teacher.
        if (needsKey) patch.boardKey = genCode(12);
        if (needsSince) {
          const start = (data.createdAt || '').slice(0, 10) || TODAY;
          patch.slots = slots.map(s => s.since ? s : { ...s, since: start });
        }
        await tRef.set(patch, { merge:true });
        return;
      }

      setHolidays(data.holidays);
      setTeacher({ uid: teacherUid, ...data });
    }, e => {
      if (leavingRef.current || e?.code === 'permission-denied') { console.warn('teacher doc closed', e?.code); return; }
      console.error(e); setFatal('טעינת נתוני המורה נכשלה. בדוק את החיבור לאינטרנט.');
    }));

    subs.push(db.collection('students').where('teacherId', '==', teacherUid)
      .onSnapshot(s => setStudents(s.docs.map(d => ({ ...d.data(), id: d.id })))));

    subs.push(db.collection('pending_students').where('teacherId', '==', teacherUid)
      .onSnapshot(s => setPendingStudents(s.docs.map(d => ({ ...d.data(), id: d.id })))));

    subs.push(db.collectionGroup('lessons').where('teacherId', '==', teacherUid)
      .onSnapshot(
        s => { setRealLessons(s.docs.map(d => ({ ...d.data(), id: d.id }))); setLessonsLoaded(true); },
        e => {
          if (leavingRef.current) return;
          console.error(e);
          // Firestore puts a one-click "create this index" URL in the error
          // text. Surfacing it beats telling a non-developer to open DevTools.
          const url = (e.message || '').match(/https:\/\/console\.firebase\.google\.com\S+/);
          if (url) {
            setFatal('חסר אינדקס במסד הנתונים. לחץ על הכפתור למטה, ואז על "Create index" בעמוד שייפתח. ההכנה לוקחת כדקה — אחר כך רענן את הדף.');
            setFatalLink(url[0].replace(/[.,)\]]+$/, ''));
          } else {
            setFatal('טעינת השיעורים נכשלה. בדוק את החיבור לאינטרנט ורענן את הדף.');
          }
        }
      ));

    return () => subs.forEach(u => u());
  }, [db, teacherUid, auth]);

  // ── student subscriptions ─────────────────────────────────────────────────
  useEffect(() => {
    if (!db || !ready || teacherUid || !studentCode) return;
    let subs = [];
    let cancelled = false;

    (async () => {
      try {
        const doc = await db.collection('students').doc(studentCode).get();
        if (cancelled) return;
        if (!doc.exists || doc.data().status === 'deleted') {
          setMeError('הקוד לא נמצא. בקש מהמורה קישור חדש.');
          writeStoredCode(''); setStudentCode('');
          return;
        }
        const stu = { ...doc.data(), id: doc.id };
        setMe(stu); setMeError('');
        writeStoredCode(studentCode);
        const tid = stu.teacherId;

        subs.push(db.collection('students').doc(studentCode).collection('lessons')
          .onSnapshot(s => setRealLessons(s.docs.map(d => ({ ...d.data(), id: d.id })))));

        // Only this student's own teacher, and only the two weeks that matter.
        // Nothing here can reach another teacher's board, so the boards can
        // never mix.
        const key = stu.boardKey;
        [THIS_WK, NEXT_WK].forEach(ws => {
          subs.push(db.collection('boards').doc(`${key}_${ws}`).onSnapshot(d => {
            if (!d.exists) return;
            const data = d.data();
            if (data.holidays) setHolidays(data.holidays);
            setBoards(m => ({ ...m, [ws]: data }));
          }, () => {}));
          subs.push(db.collection('claims').doc(`${key}_${ws}`).onSnapshot(d => {
            setClaims(m => ({ ...m, [ws]: d.exists ? (d.data().slots || {}) : {} }));
          }, () => {}));
        });
      } catch (e) {
        console.error(e);
        if (!cancelled) setMeError('לא הצלחנו לטעון את הנתונים. בדוק את החיבור לאינטרנט.');
      }
    })();

    return () => { cancelled = true; subs.forEach(u => u()); };
    // THIS_WK is a dependency: without it, a tab left open across Saturday
    // night keeps listening to last week's documents and the student sees an
    // empty, "unpublished" board until they reload.
  }, [db, ready, teacherUid, studentCode, THIS_WK]);

  // ── students enriched with their slot, read off the authoritative schedule ──
  const enrichedStudents = useMemo(() => {
    // Only hours still in force count: an hour a student has been moved off
    // still exists in the schedule, stamped with the week it ended, and must
    // not be read as where they are now.
    const slots = (teacher?.slots || []).filter(isLiveSlot);
    return students.map(s => {
      const slot = slots.find(sl => sl.sid === s.id);
      return { ...s, di: slot ? slot.di : null, t: slot ? slot.t : null,
               type: slot ? 'fixed' : (s.type === 'fixed' ? 'flexible' : s.type) };
    });
  }, [students, teacher]);

  // Students created before the board moved carry no key, so their app would
  // look for the board at the wrong address. The teacher repairs them.
  const stuKeyRef = useRef(false);
  useEffect(() => {
    if (!db || !isTeacher || !teacher?.boardKey || stuKeyRef.current) return;
    const stale = students.filter(s => s.boardKey !== teacher.boardKey);
    if (!stale.length) return;
    stuKeyRef.current = true;
    (async () => {
      for (let i = 0; i < stale.length; i += 400) {
        const b = db.batch();
        stale.slice(i, i + 400).forEach(s => b.update(studentRef(s.id), { boardKey: teacher.boardKey }));
        await b.commit().catch(e => console.error('boardKey backfill', e));
      }
    })();
  }, [db, isTeacher, teacher, students]);

  // ── the flat lesson array the whole UI expects ────────────────────────────
  const lessons = useMemo(() => {
    if (isTeacher) return projectLessons(teacher?.slots || [], enrichedStudents, realLessons, PROJ_WEEKS);
    if (me) {
      // The student's own copy of the same two-sided story: the hour they are
      // moving to, and — until it ends — the hour they still have this week.
      const slots = [];
      if (me.prevSlot && me.prevSlot.di != null && me.prevSlot.t) {
        slots.push({ di: me.prevSlot.di, t: me.prevSlot.t, sid: me.id,
                     since: me.prevSlot.since || null, until: me.prevSlot.until || null });
      }
      if (me.di != null && me.t) {
        slots.push({ di: me.di, t: me.t, sid: me.id, since: me.slotSince || null });
      }
      return projectLessons(slots, [me], realLessons, PROJ_WEEKS);
    }
    return [];
  }, [isTeacher, teacher, enrichedStudents, realLessons, me, THIS_WK]);

  // ── record lessons that have already happened ─────────────────────────────
  // Runs once per teacher session. A lesson becomes a real document only here,
  // after its time has passed — which is what makes history factual rather than
  // derived from a schedule that may since have changed.
  const sweptRef = useRef(false);
  useEffect(() => {
    // `lessonsLoaded` is not optional. Sweeping before the existing lessons
    // arrive would see every projected lesson as virtual and overwrite real
    // cancellations with "completed" — silently destroying the history it is
    // meant to record.
    if (!db || !isTeacher || !teacher || !lessonsLoaded || sweptRef.current) return;
    if (!enrichedStudents.length) return;
    sweptRef.current = true;

    (async () => {
      try {
        const from  = teacher.lastSweep || fmtD(new Date(Date.now() - 35 * 864e5));
        const weeks = weeksBetween(from, TODAY, 12);
        if (!weeks.length) return;

        const known = new Set(realLessons.map(l => l.id));
        const due = projectLessons(teacher.slots || [], enrichedStudents, realLessons, weeks)
          .filter(l => l.virtual && l.date < TODAY && !getHoliday(l.date))
          .filter(l => !known.has(l.id));      // never touch an existing record

        for (let i = 0; i < due.length; i += 400) {
          const b = db.batch();
          due.slice(i, i + 400).forEach(l => b.set(
            lessonRef(l.sid, l.id),
            { id:l.id, teacherId:teacherUid, sid:l.sid, date:l.date, time:l.time,
              status:'completed', reason:'', autoMarked:true },
            { merge:true }
          ));
          await b.commit();
        }
        // Advance only as far as we actually swept — the 12-week cap must not
        // silently swallow the weeks beyond it after a long absence.
        await teacherRef().set({ lastSweep: weeks[weeks.length - 1] }, { merge:true });
      } catch (e) { console.error('sweep failed', e); }
    })();
  }, [db, isTeacher, teacher, lessonsLoaded, enrichedStudents, realLessons]);

  // ── auth actions ──────────────────────────────────────────────────────────
  async function loginTeacher(email, pass) {
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      return '';
    } catch (e) {
      const bad = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'];
      if (bad.includes(e.code)) return 'אימייל או סיסמה שגויים';
      if (e.code === 'auth/too-many-requests') return 'יותר מדי ניסיונות. נסה שוב בעוד כמה דקות.';
      console.error(e);
      return 'ההתחברות נכשלה — בדוק את החיבור לאינטרנט';
    }
  }

  async function loginStudent(code) {
    try {
      const doc = await db.collection('students').doc(code).get();
      if (!doc.exists || doc.data().status === 'deleted') return 'הקוד לא נמצא';
      writeStoredCode(code);
      setStudentCode(code);
      setMeError('');
      return '';
    } catch (e) { console.error(e); return 'הבדיקה נכשלה — בדוק את החיבור'; }
  }

  // Opening a student link on the teacher's own device lands in the teacher
  // interface, because the teacher session wins. That looks like the link is
  // broken, so offer the choice explicitly rather than silently ignoring it.
  useEffect(() => {
    if (isTeacher && route.kind === 'student') setRoleNotice(true);
  }, [isTeacher, route.kind]);

  async function viewAsStudent(code) {
    leavingRef.current = true;
    setRoleNotice(false); setFatal(''); setFatalLink('');
    writeStoredCode(code);
    setTeacher(null); setStudents([]); setPendingStudents([]);
    setRealLessons([]); setLessonsLoaded(false); setBoards({}); setClaims({});
    sweptRef.current = false; backfilledRef.current = false; stuKeyRef.current = false;
    try { await auth.signOut(); } catch (e) { console.error(e); }
    setStudentCode(code);
    setTimeout(() => { leavingRef.current = false; }, 4000);
  }

  async function logout() {
    leavingRef.current = true;
    setFatal(''); setFatalLink('');
    writeStoredCode('');
    setStudentCode(''); setMe(null); setMeError('');
    setTeacher(null); setStudents([]); setPendingStudents([]);
    setRealLessons([]); setBoards({}); setClaims({});
    // Must reset with realLessons — a stale `true` here would let the next
    // session's sweep run against an empty lesson list and overwrite records.
    setLessonsLoaded(false);
    sweptRef.current = false; backfilledRef.current = false; stuKeyRef.current = false;
    if (location.hash) location.hash = '';
    try { await auth.signOut(); } catch (e) { console.error(e); }
    setTimeout(() => { leavingRef.current = false; }, 4000);
  }

  // ── lesson mutations ──────────────────────────────────────────────────────
  // A virtual lesson becomes a real document the first time it is touched.
  // Claims mark an hour as taken for everyone else. They carry a display name
  // and nothing else — never the code that identifies the student.
  const HOLDS = LIVE;

  // What an hour looks like once it has been handed back. Every field a claim
  // can carry is written, because these maps are always merged: a partial
  // tombstone would leave the previous occupant's name lying underneath it.
  const RELEASED = { name: '', phone: '', released: true };

  const boardKey = isTeacher ? teacher?.boardKey : me?.boardKey;

  // Taking an hour is a lock, not a note. Two students tapping the same free
  // hour a second apart used to both get it, with only one name showing on the
  // board; now the second one is told the hour is gone. The claims map is the
  // lock because it is the one document every reader already watches.
  //
  // Throws 'taken' if someone got there first, 'unpublished' if the week has no
  // claims document yet — students may amend that document but never create it.
  async function claimSlot(date, time, stu) {
    const ref   = claimsRef(boardKey, wkStart(date));
    const key   = claimKey(parseD(date).getDay(), time);
    const share = stu?.shareContact !== false;
    // `released:false` is not decoration. Every write to this map is a merge,
    // so a claim that omitted the flag would leave an older `released:true`
    // standing underneath it — the hour would read as free with a name on it,
    // and the student would disappear from the board the moment they moved
    // back into an hour they had once left.
    const mine  = { name: stu?.name || '', phone: share ? (stu?.phone || '') : '', released: false };
    await db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists) {
        if (!isTeacher) throw new Error('unpublished');
        tx.set(ref, { teacherId: teacherUid, weekStart: wkStart(date), slots: { [key]: mine } }, { merge:true });
        return;
      }
      const cur = (snap.data().slots || {})[key];
      if (cur && !cur.released) throw new Error('taken');
      tx.set(ref, { slots: { [key]: mine } }, { merge:true });
    });
  }

  // Handing an hour back writes a marker rather than deleting the key. The
  // published board carries `state:'taken'` for every fixed student's hour, and
  // a deleted claim left that standing — so a cancelled lesson never actually
  // reopened its hour to anyone. The marker overrides the board.
  function releaseClaim(date, time) {
    return claimsRef(boardKey, wkStart(date))
      .update({ [`slots.${claimKey(parseD(date).getDay(), time)}`]: RELEASED })
      .catch(e => {       // the week may simply have no claims document yet
        if (e?.code !== 'not-found') console.error('releaseClaim', e);
      });
  }

  async function updLesson(id, patch) {
    const l = lessons.find(x => x.id === id);
    if (!l) return;
    const tid = isTeacher ? teacherUid : me?.teacherId;
    try {
      await lessonRef(l.sid, id).set({
        id, teacherId: tid, sid: l.sid, date: l.date, time: l.time,
        status: l.status, reason: l.reason || '', ...patch,
      }, { merge: true });
      // A lesson that stops holding its hour must hand the hour back, or the
      // slot stays "taken" on every student's board forever.
      const next = patch.status || l.status;
      if (HOLDS.includes(l.status) && !HOLDS.includes(next)) {
        await releaseClaim(l.date, l.time);
      }
    } catch (e) { console.error('updLesson', e); }
  }

  // A lesson that has already been adjudicated is history and must not be
  // overwritten. Re-booking the same hour therefore starts a new record rather
  // than merging over the old verdict — the cancellation and the fresh booking
  // both survive.
  const SETTLED = ['completed','cancelled_justified','cancelled_unjustified',
                   'teacher_cancelled','no_show','moved'];

  // Returns true only if the hour was actually secured — callers that are
  // moving a lesson must not give up the old hour before this succeeds.
  //
  // `extra` carries the status and provenance of a late move that is waiting on
  // the teacher. Such a request claims its hour like any booking: a request
  // that does not hold the hour it asks for is worth nothing by the time it is
  // answered.
  async function addLesson(sid, date, time, extra) {
    const tid  = isTeacher ? teacherUid : me?.teacherId;
    const base = lessonId(sid, date, time);
    const stu  = isTeacher ? enrichedStudents.find(s => s.id === sid) : me;
    const prev = lessons.find(l => l.id === base && !l.virtual);
    const id   = (prev && SETTLED.includes(prev.status))
      ? `${base}_r${Math.random().toString(36).slice(2, 6)}`
      : base;

    // The lock comes first. Writing the lesson and only then claiming the hour
    // would hand the same hour to two students whenever they overlap.
    try {
      await claimSlot(date, time, stu);
    } catch (e) {
      if (e?.message === 'taken') { alert('השעה הזו נתפסה זה עתה. בחר שעה אחרת.'); return false; }
      if (e?.message === 'unpublished') { alert('השבוע הזה עדיין לא פורסם. פנה למורה.'); return false; }
      console.error('claimSlot', e);
      alert('ההרשמה לשעה נכשלה. רענן את הדף ונסה שוב.');
      return false;
    }

    try {
      await lessonRef(sid, id).set({
        id, teacherId: tid, sid, date, time,
        status: 'scheduled', reason: '', cancelledAt: null,
        ...(extra || {}),
      }, { merge: true });
      return true;
    } catch (e) {
      console.error('addLesson', e);
      await releaseClaim(date, time);   // never leave the hour locked for nobody
      alert('ההרשמה לשעה נכשלה. רענן את הדף ונסה שוב.');
      return false;
    }
  }

  // ── publishing ────────────────────────────────────────────────────────────
  // `ws` matters: a board is a picture of one week, so it is built from the
  // schedule as it stands in that week — never from a change the teacher has
  // already made for a later one.
  function buildBoardSlots(ws, cancelledIds, blockedSlots, extraSlots) {
    const out = [], seen = new Set();
    const isBlocked = (di, t) => blockedSlots.some(b => b.di === di && b.t === t);

    slotsForWeek(teacher?.slots, ws).forEach(sl => {
      const key = `${sl.di}_${sl.t}`;
      if (seen.has(key)) return; seen.add(key);
      const stu     = sl.sid ? enrichedStudents.find(s => s.id === sl.sid) : null;
      const removed = stu ? cancelledIds.includes(stu.id) : false;
      let state = 'free', name = null, phone = '';
      if (isBlocked(sl.di, sl.t))     state = 'blocked';
      else if (stu && !removed)     {
        state = 'taken'; name = stu.name;
        // Only for students whose contact sharing is on. Never a code.
        if (stu.shareContact !== false) phone = stu.phone || '';
      }
      out.push({ di: sl.di, t: sl.t, br: sl.br || null, state, name, phone });
    });

    (extraSlots || []).forEach(sl => {
      const key = `${sl.di}_${sl.t}`;
      if (seen.has(key)) return; seen.add(key);
      out.push({ di: sl.di, t: sl.t, br: sl.br || null, state: isBlocked(sl.di, sl.t) ? 'blocked' : 'free', name: null, phone: '' });
    });

    return out;
  }

  async function pubWeek(ws, cancelledIds, blockedSlots, extraSlots, note) {
    try {
      const batch = db.batch();

      // The teacher's own planning state stays on her private document.
      // `cancelledIds` holds student codes, so it must never reach the board.
      batch.set(teacherRef(), {
        weekPlans: { [ws]: { weekStart:ws, cancelledIds, blockedSlots, extraSlots, note: note || '' } },
      }, { merge:true });

      // Cancelled or blocked lessons become real documents recording the fact,
      // and give their hour back so the board does not show it as taken.
      const freed = {};
      lessons.filter(l => inWk(l.date, ws) && l.status === 'scheduled').forEach(l => {
        const di = parseD(l.date).getDay();
        const hit = cancelledIds.includes(l.sid) || blockedSlots.some(b => b.di === di && b.t === l.time);
        if (!hit) return;
        batch.set(lessonRef(l.sid, l.id), {
          id:l.id, teacherId:teacherUid, sid:l.sid, date:l.date, time:l.time,
          status:'teacher_cancelled', reason:l.reason || '',
        }, { merge:true });
        freed[claimKey(di, l.time)] = RELEASED;
      });

      // The board is what students receive: slot states and names only —
      // never a code, a phone number, or the student list.
      batch.set(boardRef(teacher?.boardKey, ws), {
        teacherId: teacherUid, weekStart: ws, note: note || '',
        studioName: teacher?.studioName || '',
        teacherPhone: teacher?.phone || '',
        branches: teacher?.branches || [],
        branchesOn: !!teacher?.branchesOn,
        slots: buildBoardSlots(ws, cancelledIds, blockedSlots, extraSlots),
        holidays: teacher?.holidays || DEFAULT_HOLIDAYS,
        publishedAt: new Date().toISOString(),
      });

      // Students may amend the claims map but never create it, so publishing
      // is what opens the week for booking. merge:true leaves other claims
      // untouched when the week is republished.
      batch.set(claimsRef(teacher?.boardKey, ws), { teacherId: teacherUid, weekStart: ws, slots: freed }, { merge:true });

      await batch.commit();
    } catch (e) { console.error('pubWeek', e); alert('הפרסום נכשל. בדוק את החיבור ונסה שוב.'); }
  }

  async function clearPublishedWeek(ws) {
    try {
      // set(merge) deep-merges maps, so an omitted key survives — the plan has
      // to be deleted explicitly or the week still reads as published.
      await teacherRef().update({ [`weekPlans.${ws}`]: firebase.firestore.FieldValue.delete() });
      await boardRef(teacher?.boardKey, ws).delete().catch(() => {});
      await claimsRef(teacher?.boardKey, ws).delete().catch(() => {});
    } catch (e) { console.error('clearPublishedWeek', e); }
  }

  // ── recurring schedule ────────────────────────────────────────────────────
  // Each of these is one or two writes. Nothing walks the calendar.
  //
  // Every one of them takes `from`: the first week the change applies to. The
  // week-ahead planner passes NEXT_WK, so nothing done there can reach into a
  // week that is already out and full — which is what used to happen, an hour
  // added for next week appearing this week on top of hours already given out.
  // A change from anywhere else is meant for now and passes THIS_WK.
  //
  // Ending an hour that is still in force this week does not delete it: it is
  // stamped `until`, so the weeks it really ran keep their shape and it simply
  // stops from `from` onward. Hours are only edited in place when the change
  // starts here and now.
  const liveSlots  = () => (teacher?.slots || []).filter(isLiveSlot);
  const findSlot   = (di, t) => liveSlots().find(s => s.di === di && s.t === t);
  // An hour ended long ago is no longer needed to draw or project anything.
  const keepSlot   = (s) => !s.until || effWeek(s.until) > addDays(THIS_WK, -84);

  // Retire an hour from `from` onward, or drop it outright when it never ran.
  function retire(slots, match, from) {
    return slots.filter(keepSlot).flatMap(s => {
      if (!match(s)) return [s];
      if (!isLiveSlot(s)) return [s];                       // already ended
      if (effWeek(s.since) >= from) return [];              // never ran — drop
      return [{ ...s, until: from }];                       // keep the history
    });
  }

  async function addBaseSlot(di, t, sid = null, br = null, from = THIS_WK) {
    const slots = [...retire(teacher?.slots || [], s => s.di === di && s.t === t, from),
                   { di, t, sid: sid || null, br: br || null, since: from }];
    const batch = db.batch();
    batch.set(teacherRef(), { slots }, { merge:true });
    // The student's own copy of the same window, so their app draws the same
    // weeks the teacher's does.
    if (sid) batch.update(studentRef(sid), { type:'fixed', di, t, slotSince: from, prevSlot: null });
    await batch.commit().catch(e => console.error('addBaseSlot', e));
  }

  async function removeBaseSlot(di, t, from = THIS_WK) {
    const slot  = findSlot(di, t);
    const slots = retire(teacher?.slots || [], s => s.di === di && s.t === t, from);
    const batch = db.batch();
    batch.set(teacherRef(), { slots }, { merge:true });
    if (slot?.sid && students.some(s => s.id === slot.sid)) {
      // Their hour still runs up to `from` — the weeks before it keep it.
      const ranBefore = effWeek(slot.since) < from;
      batch.update(studentRef(slot.sid), {
        type:'flexible', di:null, t:null, slotSince: null,
        prevSlot: ranBefore ? { di, t, since: slot.since || null, until: from } : null,
      });
    }
    await batch.commit().catch(e => console.error('removeBaseSlot', e));
  }

  async function moveBaseSlot(oldDi, oldT, newDi, newT, newBr, from = THIS_WK) {
    const slot = findSlot(oldDi, oldT);
    if (!slot) return;
    const br = newBr !== undefined ? newBr : (slot.br || null);
    // The old hour ends where the new one begins, so the weeks in between —
    // including any week already published — keep the lesson where it was.
    const slots = [
      ...retire(teacher?.slots || [],
                s => (s.di === oldDi && s.t === oldT) || (s.di === newDi && s.t === newT),
                from),
      { ...slot, di:newDi, t:newT, br, since: from, until: undefined },
    ].map(s => { const c = { ...s }; if (c.until === undefined) delete c.until; return c; });
    const batch = db.batch();
    batch.set(teacherRef(), { slots }, { merge:true });
    if (slot.sid && students.some(s => s.id === slot.sid)) {
      const ranBefore = effWeek(slot.since) < from;
      batch.update(studentRef(slot.sid), {
        di:newDi, t:newT, slotSince: from,
        prevSlot: ranBefore ? { di:oldDi, t:oldT, since: slot.since || null, until: from } : null,
      });
    }
    await batch.commit().catch(e => console.error('moveBaseSlot', e));
  }

  function fixOrphanedSlot(di, t) {
    const slots = (teacher?.slots || []).map(s =>
      s.di === di && s.t === t && isLiveSlot(s) ? { ...s, sid:null } : s);
    return teacherRef().set({ slots }, { merge:true }).catch(e => console.error(e));
  }

  // ── branches ──────────────────────────────────────────────────────────────
  function setBranches(list)  { return updateTeacher({ branches: list }); }
  function setBranchesOn(on)  { return updateTeacher({ branchesOn: !!on }); }

  // Assigning an existing hour to a branch, from anywhere in the app.
  function setSlotBranch(di, t, br) {
    const slots = (teacher?.slots || []).map(s => (s.di === di && s.t === t && isLiveSlot(s)) ? { ...s, br: br || null } : s);
    return teacherRef().set({ slots }, { merge:true }).catch(e => console.error('setSlotBranch', e));
  }

  // Tag a whole day at once — the usual shape of a real week, where a village
  // owns a day. Thursday, which is split, is then fixed hour by hour.
  function setDayBranch(di, br) {
    const slots = (teacher?.slots || []).map(s => (s.di === di && isLiveSlot(s)) ? { ...s, br: br || null } : s);
    return teacherRef().set({ slots }, { merge:true }).catch(e => console.error('setDayBranch', e));
  }

  // ── students ──────────────────────────────────────────────────────────────
  async function deleteStudent(sid) {
    try {
      const slots = (teacher?.slots || []).map(s => (s.sid === sid && isLiveSlot(s)) ? { ...s, sid:null } : s);
      await teacherRef().set({ slots }, { merge:true });

      // Hand back any hours they were still holding, or those slots stay
      // "taken" on every student's board with no lesson behind them.
      const held = lessons.filter(l => l.sid === sid && HOLDS.includes(l.status) && l.date >= THIS_WK);
      const byWeek = {};
      held.forEach(l => {
        const ws = wkStart(l.date);
        (byWeek[ws] = byWeek[ws] || {})[`slots.${claimKey(parseD(l.date).getDay(), l.time)}`] = RELEASED;
      });
      await Promise.all(Object.entries(byWeek).map(([ws, patch]) =>
        claimsRef(teacher?.boardKey, ws).update(patch).catch(() => {})));

      const snap = await studentRef(sid).collection('lessons').get();
      for (let i = 0; i < snap.docs.length; i += 400) {
        const b = db.batch();
        snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
        await b.commit();
      }
      await studentRef(sid).delete();
      // Their name and phone are still on any week already published.
      await Promise.all([republishBoard(THIS_WK), republishBoard(NEXT_WK)]);
    } catch (e) { console.error('deleteStudent', e); }
  }

  // Rewrite an already-published week from current data. Used whenever
  // something changed that the published board would otherwise keep showing.
  // `planOverride` matters when the plan was just written: the teacher document
  // snapshot has not come back yet, so reading it from state would republish
  // the board from the version without the change.
  async function republishBoard(ws, planOverride) {
    const plan = planOverride || teacher?.weekPlans?.[ws];
    if (!plan || !teacher?.boardKey) return;
    await boardRef(teacher.boardKey, ws).set({
      teacherId: teacherUid, weekStart: ws, note: plan.note || '',
      studioName: teacher?.studioName || '',
      teacherPhone: teacher?.phone || '',
      branches: teacher?.branches || [],
      branchesOn: !!teacher?.branchesOn,
      slots: buildBoardSlots(ws, plan.cancelledIds || [], plan.blockedSlots || [], plan.extraSlots || []),
      holidays: teacher?.holidays || DEFAULT_HOLIDAYS,
      publishedAt: new Date().toISOString(),
    }, { merge:true }).catch(e => console.error('republishBoard', e));
  }

  // ── blocking an hour in a week that is already out ────────────────────────
  // Planning happens a week ahead, but life does not. This edits the plan of
  // any week in place and rewrites the board students are already looking at,
  // so "I am not here on Tuesday" takes effect the moment it is tapped.
  async function setWeekBlock(ws, di, t, on) {
    try {
      const published = !!teacher?.weekPlans?.[ws];
      const cur  = teacher?.weekPlans?.[ws] || { weekStart:ws, cancelledIds:[], blockedSlots:[], extraSlots:[], note:'' };
      const rest = (cur.blockedSlots || []).filter(b => !(b.di === di && b.t === t));
      const plan = { ...cur, weekStart: ws, blockedSlots: on ? [...rest, { di, t }] : rest };

      await teacherRef().set({ weekPlans: { [ws]: plan } }, { merge:true });

      if (on) {
        // Whoever held that hour has to be told, and the hour handed back.
        const date = dateOfDi(ws, di);
        const hit  = lessons.filter(l => l.date === date && l.time === t && HOLDS.includes(l.status));
        for (const l of hit) await updLesson(l.id, { status:'teacher_cancelled' });
      }
      // A week that was never published stays unpublished — blocking an hour
      // must not push a board out before the teacher meant to.
      if (published) await republishBoard(ws, plan);
    } catch (e) {
      console.error('setWeekBlock', e);
      alert('עדכון החסימה נכשל. בדוק את החיבור ונסה שוב.');
    }
  }

  // ── an extra hour in a week that is already out ───────────────────────────
  // The mirror image of blocking: "this Wednesday I can also come in the
  // morning". It adds to the same week plan, so the hour behaves like any
  // other open hour — bookable by the teacher, visible to students — but only
  // for that one week.
  async function setWeekExtra(ws, di, t, on, br) {
    try {
      const published = !!teacher?.weekPlans?.[ws];
      const cur  = teacher?.weekPlans?.[ws] || { weekStart:ws, cancelledIds:[], blockedSlots:[], extraSlots:[], note:'' };
      const rest = (cur.extraSlots || []).filter(e => !(e.di === di && e.t === t));
      const plan = {
        ...cur, weekStart: ws,
        extraSlots: on ? [...rest, { di, t, br: br || null }] : rest,
        // Adding an hour back that was blocked earlier in the week should not
        // leave it blocked, or it would be added and instantly hidden.
        blockedSlots: on ? (cur.blockedSlots || []).filter(b => !(b.di === di && b.t === t)) : (cur.blockedSlots || []),
      };

      await teacherRef().set({ weekPlans: { [ws]: plan } }, { merge:true });
      if (published) await republishBoard(ws, plan);
    } catch (e) {
      console.error('setWeekExtra', e);
      alert('עדכון השעה החריגה נכשל. בדוק את החיבור ונסה שוב.');
    }
  }

  // ── late move requests ────────────────────────────────────────────────────
  // A student who moves a lesson less than 24 hours before it starts does not
  // move it — they ask. Until the teacher answers, the student holds both the
  // old hour and the requested one, so the answer cannot arrive too late to be
  // meaningful. Approving hands over the old hour; refusing gives back the new
  // one and leaves the original lesson exactly as it was.
  async function resolveMove(pending, approve) {
    try {
      if (approve) {
        await updLesson(pending.id, { status: 'scheduled' });
        if (pending.movedFromId) await updLesson(pending.movedFromId, { status: 'moved' });
      } else {
        await lessonRef(pending.sid, pending.id).delete();
        await releaseClaim(pending.date, pending.time);
      }
    } catch (e) {
      console.error('resolveMove', e);
      alert('העדכון נכשל. בדוק את החיבור ונסה שוב.');
    }
  }

  // ── repairing the taken-hours map ─────────────────────────────────────────
  // The lessons are the record of truth; the claims map is a cache of them that
  // the board reads. They can drift — a write that lands half-way, a browser
  // closed mid-move, or the merge bug that used to leave a "released" marker
  // sitting under a fresh booking and hid the student from the board entirely.
  //
  // So: every hour a real lesson holds must read as taken by that student, and
  // every hour claimed by nobody must read as free. Only actual differences are
  // written, so on a healthy week this costs two reads and nothing else.
  async function repairClaims(ws) {
    if (!teacher?.boardKey) return 0;
    const ref = claimsRef(teacher.boardKey, ws);
    const snap = await ref.get();
    if (!snap.exists) return 0;              // week not published — nothing to repair
    const cur = snap.data().slots || {};

    const heldAll  = lessons.filter(l => HOLDS.includes(l.status) && inWk(l.date, ws));
    const heldReal = heldAll.filter(l => !l.virtual);
    const patch = {};

    // Hours a lesson holds, that the board would not show as taken.
    heldReal.forEach(l => {
      const key = claimKey(parseD(l.date).getDay(), l.time);
      const stu = enrichedStudents.find(s => s.id === l.sid);
      if (!stu) return;
      const want = { name: stu.name || '', phone: stu.shareContact !== false ? (stu.phone || '') : '', released: false };
      const got  = cur[key];
      if (!got || got.released === true || got.name !== want.name || got.phone !== want.phone) patch[key] = want;
    });

    // Hours the board shows as taken with no lesson behind them.
    Object.entries(cur).forEach(([key, v]) => {
      if (!v || v.released === true) return;
      const held = heldAll.some(l => claimKey(parseD(l.date).getDay(), l.time) === key);
      if (!held) patch[key] = RELEASED;
    });

    const n = Object.keys(patch).length;
    if (n) await ref.set({ slots: patch }, { merge:true });
    return n;
  }

  // Runs once per teacher session, quietly. A teacher opening the app is the
  // only moment we can be sure the whole lesson list is in hand.
  const repairedRef = useRef(false);
  useEffect(() => {
    if (!db || !isTeacher || !teacher?.boardKey || !lessonsLoaded || repairedRef.current) return;
    if (!enrichedStudents.length) return;
    repairedRef.current = true;
    (async () => {
      try {
        const fixed = (await repairClaims(THIS_WK)) + (await repairClaims(NEXT_WK));
        if (fixed) console.info(`repairClaims: ${fixed} hour(s) resynced`);
      } catch (e) { console.error('repairClaims', e); }
    })();
  }, [db, isTeacher, teacher, lessonsLoaded, enrichedStudents, lessons]);

  // Claims are written at booking time and hold a snapshot of the phone, so
  // they need scrubbing too.
  async function rewriteClaimsFor(sid, phone, nameOverride) {
    const held = lessons.filter(l => l.sid === sid && HOLDS.includes(l.status) && l.date >= THIS_WK);
    const stu  = enrichedStudents.find(s => s.id === sid);
    // The caller may have just renamed this student: their own value wins over
    // the snapshot, which has not come back yet.
    const name = nameOverride != null ? nameOverride : (stu?.name || '');
    const byWeek = {};
    held.forEach(l => {
      const ws = wkStart(l.date);
      (byWeek[ws] = byWeek[ws] || {})[claimKey(parseD(l.date).getDay(), l.time)] =
        { name, phone, released: false };
    });
    await Promise.all(Object.entries(byWeek).map(([ws, slots]) =>
      claimsRef(teacher?.boardKey, ws).set({ slots }, { merge:true }).catch(() => {})));
  }

  // Studio name, teacher name, and her own holiday list.
  function updateTeacher(patch) {
    return teacherRef().set(patch, { merge:true }).catch(e => console.error('updateTeacher', e));
  }

  // Editing a student is not just a document write: their name and phone are
  // copied into every published board and into the taken-hours map, so those
  // copies have to be rewritten or the old name lingers on other students'
  // screens for as long as the week stays published.
  async function updateStudent(sid, patch) {
    try {
      await studentRef(sid).update(patch);
      const stu = { ...(enrichedStudents.find(s => s.id === sid) || {}), ...patch };
      await Promise.all([republishBoard(THIS_WK), republishBoard(NEXT_WK)]);
      await rewriteClaimsFor(sid, stu.shareContact !== false ? (stu.phone || '') : '', stu.name);
    } catch (e) {
      console.error('updateStudent', e);
      alert('עדכון פרטי התלמיד נכשל. בדוק את החיבור ונסה שוב.');
    }
  }

  async function setShareContact(sid, on) {
    try {
      await studentRef(sid).update({ shareContact: !!on });
      const stu = enrichedStudents.find(s => s.id === sid);
      // Republish so the change takes effect on weeks already out, rather than
      // leaving the number visible until the teacher happens to publish again.
      await Promise.all([republishBoard(THIS_WK), republishBoard(NEXT_WK)]);
      await rewriteClaimsFor(sid, on ? (stu?.phone || '') : '');
    } catch (e) { console.error('setShareContact', e); }
  }
  function assignSecondSlot(sid, slot) {
    return studentRef(sid).update({ secondSlot: { ...slot, since: THIS_WK } })
                          .catch(e => console.error(e));
  }
  function removeSecondSlot(sid) {
    return studentRef(sid).update({ secondSlot: null }).catch(e => console.error(e));
  }
  function changeToFixed(sid, di, t) {
    const stu = enrichedStudents.find(s => s.id === sid);
    return addBaseSlot(di, t, sid, stu?.br || null, THIS_WK);
  }

  async function changeToFlexible(sid, keepSlotOpen) {
    const slot = liveSlots().find(s => s.sid === sid);
    if (!slot) return studentRef(sid).update({ type:'flexible', di:null, t:null });
    if (keepSlotOpen) {
      const slots = (teacher?.slots || []).map(s => (s.sid === sid && isLiveSlot(s)) ? { ...s, sid:null } : s);
      const batch = db.batch();
      batch.set(teacherRef(), { slots }, { merge:true });
      batch.update(studentRef(sid), { type:'flexible', di:null, t:null });
      await batch.commit().catch(e => console.error(e));
    } else {
      await removeBaseSlot(slot.di, slot.t);
    }
  }

  // Codes must be unguessable and unique — the document id is the secret.
  async function allocCode() {
    for (let i = 0; i < 8; i++) {
      const c = genCode(6);
      const d = await db.collection('students').doc(c).get();
      if (!d.exists) return c;
    }
    return genCode(9);
  }

  // Shared by "approve a registration" and "add a student myself".
  async function createStudent({ name, phone, parent, type, di, t, share, br }, pendingId) {
    const code  = await allocCode();
    const fixed = type === 'fixed' && di != null && t;
    const batch = db.batch();
    batch.set(studentRef(code), {
      teacherId: teacherUid, code, boardKey: teacher?.boardKey || '',
      name: name.trim(), phone: phone || '', parent: parent || '',
      shareContact: share !== false, br: br || null,
      type: fixed ? 'fixed' : 'flexible', status: 'active',
      di: fixed ? di : null, t: fixed ? t : null,
      slotSince: fixed ? THIS_WK : null, prevSlot: null,
      secondSlot: null, createdAt: new Date().toISOString(),
    });
    if (pendingId) batch.delete(db.collection('pending_students').doc(pendingId));
    if (fixed) {
      const slots = [...retire(teacher?.slots || [], s => s.di === di && s.t === t, THIS_WK),
                     { di, t, sid: code, br: br || null, since: THIS_WK }];
      batch.set(teacherRef(), { slots }, { merge:true });
    }
    await batch.commit();
    setApprovedInfo({ name: name.trim(), code, phone: phone || '' });
  }

  async function approveStudent(pendingId, ps, assignType, aDi, aT, aBr) {
    try {
      await createStudent({ name:ps.name, phone:ps.phone, parent:ps.parent,
                            type:assignType, di:aDi, t:aT, br:aBr }, pendingId);
    } catch (e) { console.error('approveStudent', e); alert('אישור התלמיד נכשל. נסה שוב.'); }
  }

  async function addStudent(data) {
    try { await createStudent(data, null); }
    catch (e) { console.error('addStudent', e); alert('הוספת התלמיד נכשלה. נסה שוב.'); }
  }

  function rejectStudent(pendingId) {
    return db.collection('pending_students').doc(pendingId).delete().catch(e => console.error(e));
  }

  // ── render ────────────────────────────────────────────────────────────────
  if (fatal) return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'100vh', gap:14, padding:24, background:'var(--color-background-tertiary)' }}>
      <div style={{ fontSize:44 }}>⚠️</div>
      <div style={{ fontSize:15, color:'var(--color-text-danger)', textAlign:'center', maxWidth:340, lineHeight:1.7, direction:'rtl' }}>{fatal}</div>
      {!fatalLink && (
        <button style={{ ...S.btn('primary'), marginTop:4 }} onClick={() => location.reload()}>
          רענן ונסה שוב
        </button>
      )}
      {fatalLink && (
        <>
          <a href={fatalLink} target="_blank" rel="noopener noreferrer"
             style={{ ...S.btn('primary'), textDecoration:'none', display:'inline-block', padding:'12px 22px' }}>
            פתח את דף יצירת האינדקס ↗
          </a>
          <button style={{ ...S.btn('default'), marginTop:4 }} onClick={() => location.reload()}>
            סיימתי — רענן
          </button>
        </>
      )}
    </div>
  );

  if (!db || !ready) return <LoadingView />;

  if (route.kind === 'register') {
    return <RegisterView db={db} teacherId={route.teacherId} studioName="" />;
  }

  // The teacher edits her private plan for next week; students see the board
  // that was published from it. Both are truthy only once the week is out.
  const pubNext = isTeacher
    ? (teacher?.weekPlans?.[NEXT_WK] || null)
    : (boards[NEXT_WK] || null);

  // The current week's plan — where its blocks, extra hours and removed
  // students live. Every teacher screen that offers an hour for booking has to
  // read it, or it offers hours the teacher has already blocked.
  const pubThis = isTeacher
    ? (teacher?.weekPlans?.[THIS_WK] || null)
    : (boards[THIS_WK] || null);

  const ctx = {
    students: enrichedStudents, pendingStudents, lessons,
    TODAY, THIS_WK, NEXT_WK, pubThis, pubNext, boards, claims, setWeekBlock, setWeekExtra, resolveMove,
    updLesson, addLesson, pubWeek, approveStudent, rejectStudent, deleteStudent,
    approvedInfo, clearApprovedInfo: () => setApprovedInfo(null),
    baseSlots: teacher?.slots || [],
    addBaseSlot, removeBaseSlot, moveBaseSlot, clearPublishedWeek,
    assignSecondSlot, removeSecondSlot, changeToFixed, changeToFlexible, fixOrphanedSlot,
    addStudent, setShareContact, updateStudent, updateTeacher,
    branches: teacher?.branches || [], branchesOn: !!teacher?.branchesOn,
    setBranches, setBranchesOn, setSlotBranch, setDayBranch, showCode: (name, code, phone) => setApprovedInfo({ name, code, phone }),
    teacher, me, logout,
  };

  if (isTeacher) {
    if (!teacher) return <LoadingView />;
    return (
      <>
        <TeacherView ctx={ctx} />
        {roleNotice && (
          <Modal onClose={() => { setRoleNotice(false); location.hash = ''; }}>
            <div style={{ direction:'rtl', textAlign:'center', padding:'4px 0' }}>
              <div style={{ fontSize:34, marginBottom:10 }}>👋</div>
              <div style={{ fontSize:16, fontWeight:600, marginBottom:8 }}>זה קישור של תלמיד</div>
              <p style={{ fontSize:13.5, color:'var(--color-text-secondary)', margin:'0 0 18px', lineHeight:1.6 }}>
                אתה מחובר כמורה בדפדפן הזה, ולכן נפתח ממשק המורה.
                אצל התלמיד הקישור ייפתח נכון.
              </p>
              <button style={{ ...S.btn('primary'), width:'100%', marginBottom:8 }}
                onClick={() => viewAsStudent(route.code)}>
                👁 בדוק איך זה נראה לתלמיד
              </button>
              <div style={{ fontSize:11, color:'var(--color-text-secondary)', marginBottom:12 }}>
                תתנתק מחשבון המורה. כניסה חוזרת עם האימייל והסיסמה.
              </div>
              <button style={{ ...S.btn('ghost'), width:'100%' }}
                onClick={() => { setRoleNotice(false); location.hash = ''; }}>
                המשך כמורה
              </button>
            </div>
          </Modal>
        )}
      </>
    );
  }
  if (isStudent) return <StudentView ctx={ctx} />;
  if (studentCode && !meError) return <LoadingView />;

  return (
    <>
      <LoginView onTeacher={loginTeacher} onStudent={loginStudent} />
      {meError && (
        <div style={{ position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
          background:'var(--color-background-danger)', color:'var(--color-text-danger)',
          padding:'10px 18px', borderRadius:10, fontSize:13, maxWidth:320, textAlign:'center', direction:'rtl' }}>
          {meError}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(MusicScheduler));

</script>
</body>
</html>
